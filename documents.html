<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Documents | Al Hyakel Portal</title>
<link rel="icon" href="assets/favicon.png">
<link rel="stylesheet" href="assets/portal.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="assets/config.js"></script>
<script src="assets/portal.js" data-module="docs"></script>
<style>
main{max-width:1100px}
.doc-head{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:6px}
.doc-tabs{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0 20px;border-bottom:2px solid var(--border)}
.doc-tabs a,.doc-tabs span{padding:8px 14px;text-decoration:none;font-weight:600;font-size:14px;border-bottom:3px solid transparent;margin-bottom:-2px;color:var(--muted)}
.doc-tabs a.on{color:var(--teal-dark);border-bottom-color:var(--orange)}
.doc-tabs span{opacity:.55;cursor:default}
.doc-tabs span small{font-weight:500}
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:end;margin-bottom:14px}
.tools .field{margin:0}
.tools input[type=search]{width:min(340px,100%)}
td .btn{margin-right:4px}
td.no{font:600 14px/1.2 Consolas,Menlo,monospace;color:var(--teal-dark);white-space:nowrap}
.res{display:inline-block;font-size:12px;font-weight:700;padding:2px 9px;border-radius:99px}
.res.PASS{background:#e3f2e9;color:var(--green)}
.res.FAIL{background:#fbe6e4;color:var(--red)}
.empty{padding:34px 18px;text-align:center;color:var(--muted)}
tbody tr.click{cursor:pointer}
tbody tr.click:hover td{background:#f6f9f9}

/* form */
.sheet{background:#fff;border:1px solid var(--border);border-radius:8px;padding:6px 22px 18px;margin-bottom:16px}
.sheet h3{color:var(--teal-dark);font-size:1.05rem;margin:16px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--border)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:2px 18px}
.field input,.field select,.field textarea{width:100%}
textarea{font:inherit;padding:8px 10px;border:1px solid var(--border);border-radius:5px;resize:vertical;min-height:70px}
textarea:focus{outline:2px solid var(--teal);outline-offset:1px}
.fixed{padding:8px 10px;background:#f2f5f5;border:1px dashed var(--border);border-radius:5px;font-weight:600;color:var(--teal-dark)}
.choice{display:flex;gap:18px;flex-wrap:wrap;padding:6px 0}
.choice label{display:flex;align-items:center;gap:7px;font-weight:600;cursor:pointer}
.choice input{width:18px;height:18px;margin:0}
.choice.result label{padding:6px 14px;border:2px solid var(--border);border-radius:6px}
.choice.result label:has(input:checked)[data-v=PASS]{border-color:var(--green);color:var(--green);background:#eef7f1}
.choice.result label:has(input:checked)[data-v=FAIL]{border-color:var(--red);color:var(--red);background:#fdf0ee}
.hint{font-size:13px;color:var(--muted);margin:2px 0 0}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.slot{border:2px dashed var(--border);border-radius:8px;aspect-ratio:4/3;position:relative;display:grid;place-items:center;background:#fafcfc;overflow:hidden}
.slot img{width:100%;height:100%;object-fit:contain;background:#fff}
.slot .lbl{color:var(--muted);font-size:14px;text-align:center;padding:10px}
.slot input{position:absolute;inset:0;opacity:0;cursor:pointer}
.slot .x{position:absolute;top:6px;right:6px;background:#fff;border:1px solid var(--border);border-radius:4px;padding:2px 8px;font-size:13px;cursor:pointer;z-index:2}
.slot.qr{aspect-ratio:1;max-width:220px}
.slot.filled{border-style:solid}
.slot.ro input{display:none}
.bar{position:sticky;bottom:0;background:rgba(242,245,245,.96);border-top:1px solid var(--border);padding:12px 0;display:flex;gap:10px;flex-wrap:wrap;align-items:center;z-index:5}
.bar .grow{flex:1}
.meta{font-size:13px;color:var(--muted)}
.err{margin:0}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--teal-dark);color:#fff;padding:10px 18px;border-radius:6px;font-weight:600;z-index:60;box-shadow:0 6px 20px rgba(0,0,0,.2)}
#toast.bad{background:var(--red)}
.busy{opacity:.6;pointer-events:none}
/* line items */
.items{width:100%;border-collapse:collapse;min-width:640px}
.items th{background:#e3efef;color:var(--teal-dark);font-size:13px;padding:7px 8px}
.items td{padding:4px;border-bottom:1px solid var(--border);vertical-align:top}
.items td input,.items td textarea{width:100%;padding:6px 7px;min-height:0}
.items td textarea{resize:vertical;min-height:36px}
.items td.n{width:34px;text-align:center;color:var(--muted);padding-top:12px}
.items td.amt{text-align:right;font-variant-numeric:tabular-nums;padding:12px 8px 0;white-space:nowrap}
.items input[type=number]{text-align:right}
.items .rm{background:none;border:0;color:var(--red);cursor:pointer;font-size:18px;line-height:1;padding:8px 6px}
.totals{margin:12px 0 0 auto;width:min(320px,100%);font-variant-numeric:tabular-nums}
.totals div{display:flex;justify-content:space-between;padding:5px 2px;border-bottom:1px solid var(--border)}
.totals div.grand{font-weight:700;color:var(--teal-dark);font-size:1.1rem;border-bottom:2px solid var(--teal)}
td.money{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
@media (max-width:600px){main{padding:18px 14px 40px}.sheet{padding:4px 14px 14px}}
</style>
</head>
<body>
<main>
  <div class="doc-head">
    <div><h1>Documents</h1><p class="muted" style="margin:4px 0 0">Certificates aur company documents banayein, save karein aur PDF download karein.</p></div>
    <span class="pill" id="myRole"></span>
  </div>
  <nav class="doc-tabs" id="tabs" aria-label="Document types">
    <a href="#leak" data-t="leak">Leak Test Certificate</a>
    <a href="#dn" data-t="dn">Delivery Note</a>
    <a href="#quotation" data-t="quotation">Quotation</a>
    <span title="Agle phase mein">Purchase Order <small>(jaldi)</small></span>
    <span title="Agle phase mein">Tank Certificate <small>(jaldi)</small></span>
  </nav>
  <div id="view"></div>
</main>
<div id="toast" hidden></div>

<script>
(async () => {
/* ============================== setup ============================== */
const U = await window.PORTAL_READY;
const sb = window.portalSb;
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
const view = $('#view');
const ROLE = U.docs_role;                       // manager | staff | viewer
const CAN_EDIT = ROLE === 'manager' || ROLE === 'staff';
const CAN_DELETE = ROLE === 'manager';
$('#myRole').textContent = ROLE;
const BUCKET = 'docs';
const today = () => new Intl.DateTimeFormat('en-CA', {timeZone: 'Asia/Riyadh'}).format(new Date());
const fmtDate = d => d ? new Date(d + 'T00:00:00').toLocaleDateString('en-GB', {day: '2-digit', month: 'short', year: 'numeric'}) : '';

/* Leak test: fixed standards (saved inside each certificate, so old ones never change) */
const LEAK = {
  pressure: '0.30 Bar / 4.2 PSI',
  prv: '0.60 Bar / 8.5 PSI',
  statement: (result, method) => {
    const m = method === 'hydrostatic' ? 'hydrostatic' : 'pneumatic';
    return result === 'FAIL'
      ? `The ${m} leak test was carried out at the required test pressure of ${LEAK.pressure}. Leakage and/or pressure drop was observed during the test. The test is NOT ACCEPTED. The defects must be repaired and the equipment re-tested.`
      : `The ${m} leak test was carried out at the required test pressure of ${LEAK.pressure} for the specified test duration. All welded joints and connections were inspected and no leakage or pressure drop was observed. The test is ACCEPTED as satisfactory.`;
  }
};

let toastT;
function toast(msg, bad) {
  const t = $('#toast'); t.textContent = msg; t.className = bad ? 'bad' : ''; t.hidden = false;
  clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, bad ? 6000 : 3000);
}
const nice = e => (e && (e.message || e.error_description)) || String(e);

/* ============================== data ============================== */
let LIST = null;   // leak certificates (latest first)
async function loadList(force) {
  if (LIST && !force) return LIST;
  const {data, error} = await sb.from('docs_documents')
    .select('id, doc_no, doc_date, party_name, data, files, created_at, updated_at')
    .eq('doc_type', 'leak').order('created_at', {ascending: false}).limit(5000);
  if (error) throw error;
  LIST = data;
  return LIST;
}
const nameOf = (() => { let cache = null;
  return async id => {
    if (!id) return '';
    if (!cache) { const {data} = await sb.from('portal_users').select('id, full_name, username'); cache = Object.fromEntries((data || []).map(u => [u.id, u.full_name || u.username])); }
    return cache[id] || '';
  };
})();
function nextProjectNo() {
  const n = Math.max(0, ...(LIST || []).map(r => parseInt(r.data?.project_no, 10)).filter(Number.isFinite));
  return String(n + 1).padStart(2, '0');
}

/* ============================== images ============================== */
const blobToDataUrl = b => new Promise((ok, no) => { const r = new FileReader(); r.onload = () => ok(r.result); r.onerror = no; r.readAsDataURL(b); });
const loadImg = src => new Promise((ok, no) => { const i = new Image(); i.onload = () => ok(i); i.onerror = () => no(new Error('Image load nahi hui')); i.src = src; });
async function shrink(file, max, type, quality) {
  const img = await loadImg(URL.createObjectURL(file));
  const k = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
  const c = document.createElement('canvas');
  c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
  const g = c.getContext('2d');
  if (type === 'image/jpeg') { g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); }
  g.drawImage(img, 0, 0, c.width, c.height);
  URL.revokeObjectURL(img.src);
  const blob = await new Promise(r => c.toBlob(r, type, quality));
  return {blob, dataUrl: await blobToDataUrl(blob), w: c.width, h: c.height};
}
async function fileFromStorage(path) {
  const {data, error} = await sb.storage.from(BUCKET).download(path);
  if (error) throw error;
  const dataUrl = await blobToDataUrl(data);
  const img = await loadImg(dataUrl);
  return {dataUrl, w: img.naturalWidth, h: img.naturalHeight};
}
let ASSETS = null;
async function assets() {
  if (ASSETS) return ASSETS;
  const get = async p => { const r = await fetch(p); if (!r.ok) throw new Error(p + ' nahi mili'); const d = await blobToDataUrl(await r.blob()); const i = await loadImg(d); return {dataUrl: d, w: i.naturalWidth, h: i.naturalHeight}; };
  const [header, footer, stamp] = await Promise.all(['assets/header.jpg', 'assets/footer.jpg', 'assets/stamp.png'].map(get));
  return ASSETS = {header, footer, stamp};
}

/* ============================== PDF ============================== */
const C = {slate: [46, 88, 104], orange: [221, 107, 42], ink: [28, 36, 40], muted: [110, 122, 128], line: [176, 190, 195], shade: [236, 242, 243], green: [45, 122, 76], red: [179, 38, 30]};

function leakPdf(r, img) {
  const {jsPDF} = window.jspdf;
  const pdf = new jsPDF({unit: 'mm', format: 'a4', compress: true});
  const W = 210, H = 297, M = 12, CW = W - 2 * M;
  const hdrH = CW * img.header.h / img.header.w, ftrH = CW * img.footer.h / img.footer.w;
  const TOP = 5 + hdrH + 5, BOTTOM = H - 5 - ftrH - 4;
  const d = r.data;

  const frame = (page) => {
    pdf.addImage(img.header.dataUrl, 'JPEG', M, 5, CW, hdrH, 'hdr');
    pdf.addImage(img.footer.dataUrl, 'JPEG', M, H - 5 - ftrH, CW, ftrH, 'ftr');
    pdf.setFont('helvetica', 'normal'); pdf.setFontSize(7.5); pdf.setTextColor(...C.muted);
    pdf.text(`${r.doc_no || 'DRAFT'}   |   Page ${page} of 2`, W - M, BOTTOM + 2.5, {align: 'right'});
  };
  const fit = (text, w, size, style = 'normal') => {   // shrink a single line until it fits
    pdf.setFont('helvetica', style); let s = size;
    while (s > 6.5 && pdf.getStringUnitWidth(text) * s / pdf.internal.scaleFactor > w) s -= 0.5;
    pdf.setFontSize(s); return s;
  };
  const title = (t, y, size = 16) => {
    pdf.setFont('helvetica', 'bold'); pdf.setFontSize(size); pdf.setTextColor(...C.slate);
    pdf.text(t, W / 2, y, {align: 'center'});
    const tw = pdf.getTextWidth(t);
    pdf.setDrawColor(...C.orange); pdf.setLineWidth(0.8); pdf.line(W / 2 - tw / 2, y + 2.2, W / 2 + tw / 2, y + 2.2);
  };
  const band = (t, y) => {
    pdf.setFillColor(...C.slate); pdf.rect(M, y, CW, 7, 'F');
    pdf.setFont('helvetica', 'bold'); pdf.setFontSize(9.5); pdf.setTextColor(255, 255, 255);
    pdf.text(t, M + 3, y + 4.8);
    return y + 7;
  };
  const LW = 40;                       // label column
  const VW2 = (CW - 2 * LW) / 2;       // value column when two pairs share a row
  const cell = (x, y, w, h, label, value, opts = {}) => {
    pdf.setDrawColor(...C.line); pdf.setLineWidth(0.25);
    if (label != null) {
      pdf.setFillColor(...C.shade); pdf.rect(x, y, LW, h, 'FD');
      pdf.setTextColor(...C.slate); fit(label, LW - 4, 9, 'bold');
      pdf.text(label, x + 2.5, y + h / 2, {baseline: 'middle'});
      x += LW; w -= LW;
    }
    pdf.rect(x, y, w, h, 'S');
    if (opts.draw) return opts.draw(x, y, w, h);
    pdf.setTextColor(...C.ink); pdf.setFont('helvetica', 'normal');
    const v = String(value ?? '').trim() || '-';
    pdf.setFontSize(10);
    let lines = pdf.splitTextToSize(v, w - 5);
    if (lines.length > 1) { pdf.setFontSize(9); lines = pdf.splitTextToSize(v, w - 5).slice(0, Math.max(1, Math.floor((h - 2) / 4))); }
    pdf.text(lines, x + 2.5, y + h / 2 - (lines.length - 1) * 1.9, {baseline: 'middle'});
  };
  const pair = (y, h, a, b) => { cell(M, y, LW + VW2, h, a[0], a[1]); cell(M + LW + VW2, y, LW + VW2, h, b[0], b[1]); return y + h; };
  const wide = (y, h, label, value, opts) => { cell(M, y, CW, h, label, value, opts); return y + h; };
  const box = (x, y, on) => {
    pdf.setDrawColor(...C.ink); pdf.setLineWidth(0.35); pdf.rect(x, y, 4.2, 4.2, 'S');
    if (on) { pdf.setLineWidth(0.7); pdf.setDrawColor(...C.slate); pdf.line(x + 0.8, y + 2.2, x + 1.8, y + 3.4); pdf.line(x + 1.8, y + 3.4, x + 3.6, y + 0.8); }
  };

  /* ---------------- page 1 ---------------- */
  frame(1);
  let y = TOP + 6;
  title('LEAK TEST INSPECTION CERTIFICATE', y);
  y += 9;
  const GAP = 5, BANDS = 4 * 7, UNITS = 8 + 2.6 + 2;          // 8 rows, result block, remarks block
  const rowH = Math.min(12, (BOTTOM - y - BANDS - 3 * GAP) / UNITS);
  y = band('REPORT INFORMATION', y);
  y = pair(y, rowH, ['Test No.', r.doc_no || '(on save)'], ['Report Date', fmtDate(r.doc_date)]);
  y = pair(y, rowH, ['Project No.', d.project_no], ['Project Name', d.project_name]);
  y = wide(y, rowH, 'Client Name', r.party_name);
  y = wide(y, rowH, 'Equipment Tag / No.', d.equipment_tag);
  y += GAP;
  y = band('TEST DETAILS', y);
  y = wide(y, rowH, 'Test Method', '', {draw: (x, yy, w, h) => {
    const cy = yy + h / 2;
    [['Pneumatic', 'pneumatic'], ['Hydrostatic', 'hydrostatic']].forEach(([t, k], i) => {
      const bx = x + 4 + i * 45;
      box(bx, cy - 2.1, d.test_method === k);
      pdf.setFont('helvetica', d.test_method === k ? 'bold' : 'normal'); pdf.setFontSize(10); pdf.setTextColor(...C.ink);
      pdf.text(t, bx + 6.5, cy, {baseline: 'middle'});
    });
  }});
  y = pair(y, rowH, ['Test Medium', d.test_medium], ['Test Duration', d.test_duration]);
  y = pair(y, rowH, ['Required Test Pressure', d.test_pressure || LEAK.pressure], ['Safety Setting (PRV)', d.prv || LEAK.prv]);
  y = wide(y, rowH, 'Ambient Temperature', d.ambient_temp);
  y += GAP;
  y = band('TEST RESULT', y);
  const resH = rowH * 2.6;
  const pass = d.result !== 'FAIL';
  y = wide(y, resH, 'Result', '', {draw: (x, yy, w, h) => {
    const rw = 34;
    pdf.setFillColor(...(pass ? [233, 245, 238] : [252, 235, 233])); pdf.rect(x, yy, rw, h, 'FD');
    pdf.setFont('helvetica', 'bold'); pdf.setFontSize(20); pdf.setTextColor(...(pass ? C.green : C.red));
    pdf.text(pass ? 'PASS' : 'FAIL', x + rw / 2, yy + h / 2, {align: 'center', baseline: 'middle'});
    pdf.setFont('helvetica', 'normal'); pdf.setTextColor(...C.ink);
    const tw = w - rw - 6; let s = 10, lines;
    do { pdf.setFontSize(s); lines = pdf.splitTextToSize(d.statement || '', tw); s -= 0.5; } while (lines.length * s * 0.43 > h - 3 && s > 7);
    const lh = (s + 0.5) * 0.43;
    pdf.text(lines, x + rw + 3, yy + h / 2 - (lines.length - 1) * lh / 2, {baseline: 'middle', lineHeightFactor: 1.2});
  }});
  y += GAP;
  y = band('REMARKS', y);
  const remH = BOTTOM - y - 1;
  pdf.setDrawColor(...C.line); pdf.setLineWidth(0.25); pdf.rect(M, y, CW, remH, 'S');
  pdf.setFont('helvetica', 'normal'); pdf.setFontSize(10); pdf.setTextColor(...C.ink);
  pdf.text(pdf.splitTextToSize(String(d.remarks || '').trim() || '-', CW - 6).slice(0, Math.floor((remH - 4) / 4.5)), M + 3, y + 5.5, {lineHeightFactor: 1.3});

  /* ---------------- page 2 ---------------- */
  pdf.addPage(); frame(2);
  y = TOP + 6;
  title('TEST PHOTOGRAPHS', y, 14);
  y += 6;
  const info = [`Test No: ${r.doc_no || '(on save)'}`, d.project_name && `Project: ${d.project_name}`, r.party_name && `Client: ${r.party_name}`].filter(Boolean).join('    |    ');
  pdf.setTextColor(...C.muted); fit(info, CW, 9);
  pdf.text(info, W / 2, y, {align: 'center'});
  y += 5;
  const SIGN_H = 52, PG = 5;
  const ph = (BOTTOM - SIGN_H - y - PG) / 2, pw = (CW - PG) / 2;
  (img.photos || []).slice(0, 4).forEach((p, i) => {
    const x = M + (i % 2) * (pw + PG), yy = y + Math.floor(i / 2) * (ph + PG);
    pdf.setDrawColor(...C.line); pdf.setLineWidth(0.3); pdf.rect(x, yy, pw, ph, 'S');
    if (p) {
      const k = Math.min((pw - 4) / p.w, (ph - 4) / p.h), iw = p.w * k, ih = p.h * k;
      pdf.addImage(p.dataUrl, 'JPEG', x + (pw - iw) / 2, yy + (ph - ih) / 2, iw, ih, 'ph' + i);
    }
    pdf.setFillColor(...C.slate); pdf.rect(x, yy, 7, 6, 'F');
    pdf.setFont('helvetica', 'bold'); pdf.setFontSize(9); pdf.setTextColor(255, 255, 255);
    pdf.text(String(i + 1), x + 3.5, yy + 3.1, {align: 'center', baseline: 'middle'});
  });
  // signature (left) | stamp + QR (right)
  const by = BOTTOM - SIGN_H + 4;
  const QR = 42, qx = W - M - QR, qy = by + 2;
  pdf.setDrawColor(...C.line); pdf.setLineWidth(0.3); pdf.rect(qx, qy, QR, QR, 'S');
  if (img.qr) { const k = Math.min((QR - 2) / img.qr.w, (QR - 2) / img.qr.h); pdf.addImage(img.qr.dataUrl, 'PNG', qx + (QR - img.qr.w * k) / 2, qy + (QR - img.qr.h * k) / 2, img.qr.w * k, img.qr.h * k, 'qr'); }
  const SW = 50, SH = 25;           // real stamp size 50 x 25 mm
  const sk = Math.min(SW / img.stamp.w, SH / img.stamp.h);
  const sw = img.stamp.w * sk, sh = img.stamp.h * sk;
  pdf.addImage(img.stamp.dataUrl, 'PNG', qx - 6 - SW + (SW - sw) / 2, qy + (QR - sh) / 2, sw, sh, 'stamp');
  const sy = qy + QR - 4;
  pdf.setDrawColor(...C.ink); pdf.setLineWidth(0.4); pdf.line(M, sy, M + 70, sy);
  pdf.setFont('helvetica', 'bold'); pdf.setFontSize(9.5); pdf.setTextColor(...C.slate);
  pdf.text('Authorized Signature', M, sy + 5);
  pdf.setFont('helvetica', 'normal'); pdf.setFontSize(8.5); pdf.setTextColor(...C.muted);
  pdf.text('Al Hyakel Metal Industries', M, sy + 9.5);
  return pdf;
}

async function pdfFor(rec, photos, qr) {
  return leakPdf(rec, {...await assets(), photos, qr});
}

/* ============================== list ============================== */
async function showList() {
  view.innerHTML = '<p class="muted">Load ho raha hai…</p>';
  try { await loadList(true); } catch (e) { view.innerHTML = `<p class="flash">Database error: ${esc(nice(e))}. Kya <b>supabase_docs.sql</b> chal chuki hai?</p>`; return; }
  view.innerHTML = `
    <div class="tools">
      <div class="field"><label for="q">Search</label><input id="q" type="search" placeholder="Test no, project, client, equipment"></div>
      <div class="field"><label for="fr">Result</label><select id="fr"><option value="">All</option><option>PASS</option><option>FAIL</option></select></div>
      <span style="flex:1"></span>
      ${CAN_EDIT ? '<a class="btn" href="#leak/new">+ New certificate</a>' : ''}
    </div>
    <div class="table-wrap"><table><thead><tr><th>Test No.</th><th>Date</th><th>Project</th><th>Client</th><th>Equipment</th><th>Result</th><th></th></tr></thead><tbody id="rows"></tbody></table></div>
    <p class="muted" id="count" style="font-size:13px"></p>`;
  const draw = () => {

async function recordFiles(r) {
  const f = r.files || {};
  const photos = await Promise.all([0, 1, 2, 3].map(i => f.photos?.[i] ? fileFromStorage(f.photos[i]).catch(() => null) : null));
  const qr = f.qr ? await fileFromStorage(f.qr).catch(() => null) : null;
  return {photos, qr};
}

const VAT_NO = '311822823700003';

const num = v => { const n = parseFloat(String(v ?? '').replace(/,/g, '')); return Number.isFinite(n) ? n : 0; };
const money = n => (Number(n) || 0).toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});
const qtyTxt = v => String(v ?? '').trim() === '' ? '' : num(v).toLocaleString('en-US', {maximumFractionDigits: 3});
const r2 = x => Math.round(x * 100) / 100;

function words(n) {
  const a = ['', 'One', 'Two', 'Three', 'Four', 'Five', 'Six', 'Seven', 'Eight', 'Nine', 'Ten', 'Eleven', 'Twelve', 'Thirteen',
             'Fourteen', 'Fifteen', 'Sixteen', 'Seventeen', 'Eighteen', 'Nineteen'];
  const t = ['', '', 'Twenty', 'Thirty', 'Forty', 'Fifty', 'Sixty', 'Seventy', 'Eighty', 'Ninety'];
  const chunk = x => {
    const out = [];
    if (x >= 100) { out.push(a[Math.floor(x / 100)] + ' Hundred'); x %= 100; }
    if (x >= 20) out.push(t[Math.floor(x / 10)] + (x % 10 ? '-' + a[x % 10] : ''));
    else if (x) out.push(a[x]);
    return out.join(' ');
  };
  if (!n) return 'Zero';
  const out = [];
  for (const [u, name] of [[1e9, 'Billion'], [1e6, 'Million'], [1e3, 'Thousand']]) if (n >= u) { out.push(chunk(Math.floor(n / u)) + ' ' + name); n %= u; }
  if (n) out.push(chunk(n));
  return out.join(' ');
}
const sarWords = total => { const h = Math.round(total * 100), r = Math.floor(h / 100), hal = h % 100;
  return `Saudi Riyals ${words(r)}${hal ? ` and ${words(hal)} Halalas` : ''} Only`; };

function quoteTotals(items) {
  let sub = 0, vat = 0;
  const rows = items.map(it => {
    const line = num(it.qty) * num(it.rate);
    const tp = String(it.tax_pct ?? '').trim() === '' ? 15 : num(it.tax_pct);
    const v = line * tp / 100; sub += line; vat += v;
    return {...it, tp, vat: v, amount: line + v};
  });
  return {rows, sub: r2(sub), vat: r2(vat), total: r2(sub + vat)};
}

/* ---------- PDF ---------- */
function itemsPdf(type, r, img) {
  const T = IDOCS[type], d = r.data || {};
  const {jsPDF} = window.jspdf;
  const pdf = new jsPDF({unit: 'mm', format: 'a4', compress: true});
  const W = 210, H = 297, M = 12, CW = W - 2 * M;
  const hdrH = CW * img.header.h / img.header.w, ftrH = CW * img.footer.h / img.footer.w;
  const TOP = 5 + hdrH, BOTTOM = H - 5 - ftrH - 7;
  let y;
  const frame = () => {
    pdf.addImage(img.header.dataUrl, 'JPEG', M, 5, CW, hdrH, 'hdr');
    pdf.addImage(img.footer.dataUrl, 'JPEG', M, H - 5 - ftrH, CW, ftrH, 'ftr');
    pdf.setFont('helvetica', 'normal'); pdf.setFontSize(7.5); pdf.setTextColor(...C.slate);
    pdf.text(`VAT NO: ${VAT_NO}`, W - M, TOP + 4, {align: 'right'});
    pdf.setDrawColor(...C.slate); pdf.setLineWidth(0.5);
    pdf.line(M, TOP + 7, W - M, TOP + 7); pdf.line(M, TOP + 17, W - M, TOP + 17);
    pdf.setFont('helvetica', 'bold'); pdf.setFontSize(13.5);
    pdf.text(T.pdfTitle, W / 2, TOP + 12.2, {align: 'center', baseline: 'middle'});
    y = TOP + 23;
  };
  const newPage = () => { pdf.addPage(); frame(); };
  const need = h => { if (y + h > BOTTOM) { newPage(); return true; } return false; };
  const section = (t, width = CW) => {
    need(14);
    pdf.setFont('helvetica', 'bold'); pdf.setFontSize(9.5); pdf.setTextColor(...C.slate);
    pdf.text(t.toUpperCase(), M, y + 3.5);
    pdf.setDrawColor(...C.orange); pdf.setLineWidth(0.5); pdf.line(M, y + 5.3, M + width, y + 5.3);
    y += 8;
  };
  const kv = (pairs, cols = 2, width = CW) => {
    const colW = width / cols, LW = cols === 1 ? 42 : 32;
    for (let i = 0; i < pairs.length; i += cols) {
      const row = pairs.slice(i, i + cols);
      pdf.setFont('helvetica', 'normal'); pdf.setFontSize(9);
      const lines = row.map(([, v]) => pdf.splitTextToSize(String(v ?? '').trim() || '-', colW - LW - 3));
      const h = Math.max(7, Math.max(...lines.map(l => l.length)) * 4.1 + 3);
      need(h);
      row.forEach(([l], j) => {
        const x = M + j * colW;
        pdf.setFont('helvetica', 'bold'); pdf.setFontSize(8.5); pdf.setTextColor(...C.ink);
        pdf.text(l, x, y + 4.6);
        pdf.setFont('helvetica', 'normal'); pdf.setFontSize(9);
        pdf.text(lines[j], x + LW, y + 4.6, {lineHeightFactor: 1.15});
      });
      pdf.setDrawColor(...C.line); pdf.setLineWidth(0.2); pdf.line(M, y + h, M + width, y + h);
      y += h;
    }
    y += 3;
  };
  const table = (cols, rows) => {
    const fixed = cols.reduce((s, c) => s + (c.w || 0), 0);
    cols.forEach(c => { if (!c.w) c.w = CW - fixed; });
    const head = () => {
      let x = M;
      cols.forEach(c => {
        pdf.setFillColor(...C.shade); pdf.setDrawColor(...C.line); pdf.setLineWidth(0.2);   // text colour resets fill, so set it per cell
        pdf.rect(x, y, c.w, 7.5, 'FD');
        pdf.setFont('helvetica', 'bold'); pdf.setFontSize(8.3); pdf.setTextColor(...C.slate);
        pdf.text(c.label, c.align === 'right' ? x + c.w - 2 : x + 2, y + 4.8, {align: c.align === 'right' ? 'right' : 'left'});
        x += c.w;
      });
      y += 7.5;
    };
    need(16); head();
    rows.forEach(row => {
      pdf.setFont('helvetica', 'normal'); pdf.setFontSize(8.8);
      const lines = row.map((v, i) => pdf.splitTextToSize(String(v ?? ''), cols[i].w - 4));
      const h = Math.max(7, Math.max(...lines.map(l => l.length)) * 3.9 + 3.2);
      if (need(h)) head();
      let x = M;
      cols.forEach((c, i) => {
        pdf.setDrawColor(...C.line); pdf.setLineWidth(0.2); pdf.rect(x, y, c.w, h, 'S');
        pdf.setTextColor(...C.ink); pdf.setFont('helvetica', 'normal'); pdf.setFontSize(8.8);
        pdf.text(lines[i], c.align === 'right' ? x + c.w - 2 : x + 2, y + 4.6, {align: c.align === 'right' ? 'right' : 'left', lineHeightFactor: 1.15});
        x += c.w;
      });
      y += h;
    });
    y += 4;
  };

  frame();
  const top = [[type === 'dn' ? 'Delivery Note #' : 'Quote No.', r.doc_no || '(on save)'], [type === 'dn' ? 'Date' : 'Quote Date', fmtDate(r.doc_date)],
               ...T.head.map(([k, l]) => [l, d[k]])];
  kv(top);
  section('Customer');
  kv([['Customer Name', r.party_name], ...T.party.map(([k, l]) => [l, d[k]])], 1);
  const items = (d.items || []);
  if (type === 'dn') {
    table([{label: 'Sr.#', w: 12}, {label: 'Description'}, {label: 'Qty', w: 22, align: 'right'}, {label: 'Qty Delivered', w: 28, align: 'right'}, {label: 'Qty Received', w: 28, align: 'right'}],
      items.map((it, i) => [i + 1, it.description, qtyTxt(it.qty), qtyTxt(it.delivered), qtyTxt(it.received)]));
  } else {
    const q = quoteTotals(items);
    table([{label: '#', w: 9}, {label: 'Description'}, {label: 'Qty', w: 15, align: 'right'}, {label: 'Rate', w: 23, align: 'right'},
           {label: 'Tax %', w: 14, align: 'right'}, {label: 'VAT', w: 22, align: 'right'}, {label: 'Amount', w: 26, align: 'right'}],
      q.rows.map((it, i) => [i + 1, it.description, qtyTxt(it.qty), money(it.rate), it.tp + '%', money(it.vat), money(it.amount)]));
    // totals (right)
    need(27);
    const bx = W - M - 82, bw = 82;
    [['Sub Total', money(q.sub)], ['Standard Rate VAT (15%)', money(q.vat)]].forEach(([l, v]) => {
      pdf.setFont('helvetica', 'normal'); pdf.setFontSize(9.5); pdf.setTextColor(...C.ink);
      pdf.text(l, bx, y + 4); pdf.text(v, bx + bw, y + 4, {align: 'right'}); y += 6.5;
    });
    pdf.setDrawColor(...C.slate); pdf.setLineWidth(0.6); pdf.line(bx, y + 0.5, bx + bw, y + 0.5);
    pdf.setFont('helvetica', 'bold'); pdf.setFontSize(11); pdf.setTextColor(...C.slate);
    pdf.text('Total', bx, y + 6); pdf.text('SAR ' + money(q.total), bx + bw, y + 6, {align: 'right'});
    y += 11;
    pdf.setFont('helvetica', 'normal'); pdf.setFontSize(8.8); pdf.setTextColor(...C.ink);
    const wl = pdf.splitTextToSize('Total In Words: ' + sarWords(q.total), CW);
    need(wl.length * 4 + 4); pdf.text(wl, M, y + 3); y += wl.length * 4 + 5;
  }
  T.extra.forEach(s => { section(s.title); kv(s.fields.map(([k, l]) => [l, d[k]]), 1); });
  T.notes.forEach(([k, l]) => { if (String(d[k] || '').trim()) { section(l); kv([[l === 'Notes' ? 'Notes' : 'Remarks', d[k]]], 1); } });
  if (type === 'quotation') {
    // bank details on the left, stamp + signature on the right of the same band
    need(40);
    const y0 = y;
    section('Bank Details', 112); kv(BANK, 1, 112);
    const sw = 50, sk = Math.min(sw / img.stamp.w, 25 / img.stamp.h), x = W - M - 62;
    const sy = Math.max(y, y0 + 36);
    pdf.addImage(img.stamp.dataUrl, 'PNG', x + (62 - img.stamp.w * sk) / 2, sy - 4 - img.stamp.h * sk, img.stamp.w * sk, img.stamp.h * sk, 'stamp');
    pdf.setDrawColor(...C.ink); pdf.setLineWidth(0.35); pdf.line(x, sy, x + 62, sy);
    pdf.setFont('helvetica', 'bold'); pdf.setFontSize(8.5); pdf.setTextColor(...C.slate);
    pdf.text('Authorized Signature', x + 31, sy + 4.5, {align: 'center'});
    y = sy + 8;
  }

  // delivery note: signature lines at the bottom of the last page
  if (type === 'dn') {
    if (y + 26 > BOTTOM) newPage();
    const sy = BOTTOM - 8;
    pdf.setDrawColor(...C.ink); pdf.setLineWidth(0.35);
    const w = (CW - 20) / 3;
    ['Prepared By', 'Delivered By (Driver)', 'Received By (Name / Sign / Date)'].forEach((t, i) => {
      const x = M + i * (w + 10);
      pdf.line(x, sy, x + w, sy);
      pdf.setFont('helvetica', 'bold'); pdf.setFontSize(8.5); pdf.setTextColor(...C.slate);
      pdf.text(t, x, sy + 4.5);
    });
  }
  const n = pdf.getNumberOfPages();
  for (let i = 1; i <= n; i++) {
    pdf.setPage(i); pdf.setFont('helvetica', 'normal'); pdf.setFontSize(7.5); pdf.setTextColor(...C.muted);
    pdf.text(`${r.doc_no || 'DRAFT'}   |   Page ${i} of ${n}`, W - M, BOTTOM + 4.5, {align: 'right'});
  }
  return pdf;
}
const iPdf = async (type, r) => itemsPdf(type, r, await assets());

/* ---------- list ---------- */
async function showIList(type) {
  const T = IDOCS[type];
  view.innerHTML = '<p class="muted">Load ho raha hai…</p>';
  let list;
  try { list = await loadIList(type, true); } catch (e) { view.innerHTML = `<p class="flash">Database error: ${esc(nice(e))}</p>`; return; }
  view.innerHTML = `
    <div class="tools">
      <div class="field"><label for="q">Search</label><input id="q" type="search" placeholder="Number, customer, PO…"></div>
      <span style="flex:1"></span>
      ${CAN_EDIT ? `<a class="btn" href="#${type}/new">+ New ${esc(T.title)}</a>` : ''}
    </div>
    <div class="table-wrap"><table><thead><tr><th>No.</th><th>Date</th>${T.listCols.map(c => `<th${c[2] ? ' style="text-align:right"' : ''}>${c[0]}</th>`).join('')}<th></th></tr></thead><tbody id="rows"></tbody></table></div>
    <p class="muted" id="count" style="font-size:13px"></p>`;
  const draw = () => {
    const q = $('#q').value.trim().toLowerCase();
    const rows = list.filter(r => !q || [r.doc_no, r.party_name, ...T.search(r)].join(' ').toLowerCase().includes(q));
    $('#rows').innerHTML = rows.length ? rows.map(r => `<tr class="click" data-id="${r.id}"><td class="no">${esc(r.doc_no)}</td>
        <td style="white-space:nowrap">${esc(fmtDate(r.doc_date))}</td>${T.listCols.map(c => `<td class="${c[2] || ''}">${c[1](r)}</td>`).join('')}
        <td><button class="btn small sec" data-pdf="${r.id}">PDF</button></td></tr>`).join('')
      : `<tr><td colspan="${T.listCols.length + 3}" class="empty">${list.length ? 'Is search se kuch nahi mila.' : `Abhi tak koi ${esc(T.title)} nahi bana.` + (CAN_EDIT ? ` <a href="#${type}/new">Pehla banayein</a>.` : '')}</td></tr>`;
    $('#count').textContent = list.length ? `${rows.length} of ${list.length}` : '';
  };
  $('#q').addEventListener('input', draw);
  $('#rows').addEventListener('click', async e => {
    const b = e.target.closest('[data-pdf]');
    if (b) {
      e.stopPropagation(); b.disabled = true;
      try { const r = list.find(x => x.id === b.dataset.pdf); (await iPdf(type, r)).save(r.doc_no + '.pdf'); }
      catch (err) { toast('PDF nahi bani: ' + nice(err), true); }
      b.disabled = false; return;
    }
    const tr = e.target.closest('tr[data-id]'); if (tr) location.hash = `#${type}/${tr.dataset.id}`;
  });
  draw();
}

/* ---------- form ---------- */
async function showIForm(type, id, copyFrom) {
  const T = IDOCS[type];
  view.innerHTML = '<p class="muted">Load ho raha hai…</p>';
  let list, others;
  try { [list, others] = await Promise.all([loadIList(type, true), loadIList(type === 'dn' ? 'quotation' : 'dn')]); }
  catch (e) { view.innerHTML = `<p class="flash">Database error: ${esc(nice(e))}</p>`; return; }
  let rec = null, src = null;
  if (id || copyFrom) {
    const {data} = await sb.from('docs_documents').select('*').eq('id', id || copyFrom).eq('doc_type', type).maybeSingle();
    if (!data) { view.innerHTML = `<p class="flash">Document nahi mila. <a href="#${type}">Wapas list par</a></p>`; return; }
    src = data; if (id) rec = data;
  }
  const ro = !CAN_EDIT;
  const dis = ro ? 'disabled' : '';
  const d = {...(src?.data || {})};
  const blankItem = () => Object.fromEntries(T.items.map(c => [c.k, c.def || '']));
  let items = (d.items && d.items.length ? d.items : [blankItem()]).map(it => ({...it}));
  const who = rec ? `Banaya: ${esc(await nameOf(rec.created_by))} · ${new Date(rec.created_at).toLocaleString('en-GB', {dateStyle: 'medium', timeStyle: 'short'})}` +
    (rec.updated_at ? ` &nbsp;|&nbsp; Akhri tabdeeli: ${esc(await nameOf(rec.updated_by))} · ${new Date(rec.updated_at).toLocaleString('en-GB', {dateStyle: 'medium', timeStyle: 'short'})}` : '') : '';
  const people = [...list, ...others];
  const names = [...new Set(people.map(r => r.party_name).filter(Boolean))].sort();
  const fld = ([k, l, t], val) => `<div class="field"><label for="f_${k}">${esc(l)}</label><input id="f_${k}" ${t ? `type="${t}"` : ''} value="${esc(val)}" ${dis}></div>`;
  const dateNow = rec?.doc_date || today();

  view.innerHTML = `
    <p style="margin:0 0 10px"><a href="#${type}">&larr; ${esc(T.plural)}</a></p>
    <h2>${rec ? `${esc(T.title)} <span class="mono" style="font-size:1.1rem">${esc(rec.doc_no)}</span>` : 'New ' + esc(T.title)}</h2>
    ${who ? `<p class="meta">${who}</p>` : ''}
    <form id="f" autocomplete="off">
      <div class="sheet">
        <h3>${esc(T.title)} details</h3>
        <div class="grid">
          <div class="field"><label for="f_no">${type === 'dn' ? 'Delivery Note #' : 'Quote No.'}</label>
            ${rec ? `<div class="fixed">${esc(rec.doc_no)}</div>` : `<input id="f_no" placeholder="Auto: ${esc(T.nextNo(list, dateNow))}" ${dis}>`}</div>
          <div class="field"><label for="f_date">Date</label><input id="f_date" type="date" required value="${esc(dateNow)}" ${dis}></div>
          ${T.head.map(f => fld(f, d[f[0]])).join('')}
        </div>
        ${rec ? '' : '<p class="hint">Number khaali chhorein to agla number khud lag jayega.</p>'}
        <h3>Customer</h3>
        <div class="grid">
          <div class="field"><label for="f_party">Customer Name</label><input id="f_party" list="names" required value="${esc(src?.party_name)}" ${dis}>
            <datalist id="names">${names.map(n => `<option value="${esc(n)}">`).join('')}</datalist></div>
          ${T.party.map(f => fld(f, d[f[0]])).join('')}
        </div>
        ${ro ? '' : '<p class="hint">Purana customer chunein to uska address waghera khud bhar jayega.</p>'}
      </div>
      <div class="sheet">
        <h3>Items</h3>
        <div class="table-wrap"><table class="items"><thead><tr><th>#</th>${T.items.map(c => `<th>${esc(c.label)}</th>`).join('')}${T.money ? '<th style="text-align:right">Amount</th>' : ''}<th></th></tr></thead>
          <tbody id="items"></tbody></table></div>
        ${ro ? '' : '<button type="button" class="btn sec small" id="addItem" style="margin-top:10px">+ Add item</button>'}
        ${T.money ? '<div class="totals" id="totals"></div><p class="hint" id="inwords"></p>' : ''}
      </div>
      <div class="sheet">
        ${T.extra.map(s => `<h3>${esc(s.title)}</h3><div class="grid">${s.fields.map(f => fld(f, d[f[0]])).join('')}</div>`).join('')}
        ${T.notes.map(([k, l]) => `<div class="field" style="margin-top:12px"><label for="f_${k}">${esc(l)}</label><textarea id="f_${k}" rows="3" ${dis}>${esc(d[k])}</textarea></div>`).join('')}
      </div>
      <p class="err" id="err" role="alert"></p>
      <div class="bar">
        ${ro ? '' : '<button class="btn" id="save" type="submit">Save</button>'}
        <button class="btn sec" type="button" id="dl">Download PDF</button>
        <button class="btn sec" type="button" id="pv">Preview</button>
        ${rec && CAN_EDIT ? `<a class="btn sec" href="#${type}/copy/${rec.id}">Copy as new</a>` : ''}
        <span class="grow"></span>
        ${rec && CAN_DELETE ? '<button class="btn danger" type="button" id="del">Delete</button>' : ''}
      </div>
    </form>`;

  const form = $('#f');
  const drawItems = () => {
    const q = T.money ? quoteTotals(items) : null;
    $('#items').innerHTML = items.map((it, i) => `<tr data-i="${i}"><td class="n">${i + 1}</td>
      ${T.items.map(c => `<td${c.wide ? ' style="min-width:240px"' : ' style="width:110px"'}>${c.wide
        ? `<textarea data-k="${c.k}" rows="1" aria-label="${esc(c.label)} ${i + 1}" ${dis}>${esc(it[c.k])}</textarea>`
        : `<input data-k="${c.k}" type="number" step="any" inputmode="decimal" value="${esc(it[c.k])}" aria-label="${esc(c.label)} ${i + 1}" ${dis}>`}</td>`).join('')}
      ${T.money ? `<td class="amt">${money(q.rows[i].amount)}</td>` : ''}
      <td>${ro || items.length < 2 ? '' : `<button type="button" class="rm" data-rm="${i}" aria-label="Remove item ${i + 1}">&times;</button>`}</td></tr>`).join('');
    $$('#items textarea').forEach(grow);
    drawTotals();
  };
  const drawTotals = () => {
    if (!T.money) return;
    const q = quoteTotals(items);
    $('#totals').innerHTML = `<div><span>Sub Total</span><span>${money(q.sub)}</span></div><div><span>VAT (15%)</span><span>${money(q.vat)}</span></div>
      <div class="grand"><span>Total</span><span>SAR ${money(q.total)}</span></div>`;
    $('#inwords').textContent = sarWords(q.total);
    $$('#items tr').forEach((tr, i) => { const c = tr.querySelector('.amt'); if (c) c.textContent = money(q.rows[i].amount); });
  };
  drawItems();
  function grow(t) { t.style.height = 'auto'; t.style.height = t.scrollHeight + 2 + 'px'; }
  $('#items').addEventListener('input', e => {
    const k = e.target.dataset.k; if (!k) return;
    if (e.target.tagName === 'TEXTAREA') grow(e.target);
    items[+e.target.closest('tr').dataset.i][k] = e.target.value; drawTotals();
  });
  $('#items').addEventListener('click', e => { const b = e.target.closest('[data-rm]'); if (!b) return; items.splice(+b.dataset.rm, 1); dirty = true; drawItems(); });
  $('#addItem')?.addEventListener('click', () => { items.push(blankItem()); dirty = true; drawItems(); $('#items tr:last-child textarea')?.focus(); });
  form.addEventListener('input', () => { dirty = true; });
  // fill customer details from the latest document for that customer
  $('#f_party').addEventListener('change', () => {
    const n = $('#f_party').value.trim().toLowerCase(); if (!n) return;
    const last = people.filter(r => (r.party_name || '').trim().toLowerCase() === n).sort((a, b) => b.created_at.localeCompare(a.created_at))[0];
    if (!last) return;
    ['customer_address', 'customer_id', 'customer_trn'].forEach(k => { const el = $('#f_' + k); if (el && !el.value.trim() && last.data?.[k]) el.value = last.data[k]; });
  });

  const collect = () => {
    const data = {};
    [...T.head, ...T.party, ...T.extra.flatMap(s => s.fields), ...T.notes].forEach(([k]) => data[k] = ($('#f_' + k)?.value || '').trim());
    data.items = items.map(it => Object.fromEntries(T.items.map(c => [c.k, String(it[c.k] ?? '').trim()])))
      .filter(it => T.items.some(c => !c.def && it[c.k] !== ''));
    if (T.money) { const q = quoteTotals(data.items); Object.assign(data, {sub_total: q.sub, vat_total: q.vat, grand_total: q.total, total_in_words: sarWords(q.total)}); }
    return {doc_date: $('#f_date').value, party_name: $('#f_party').value.trim(), data};
  };
  const run = async (btn, fn) => { const t = btn.textContent; btn.disabled = true; btn.textContent = 'Ruko…'; $('#err').textContent = '';
    try { await fn(); } catch (e) { $('#err').textContent = nice(e); } btn.disabled = false; btn.textContent = t; };
  const draft = () => ({...collect(), doc_no: rec?.doc_no || ($('#f_no')?.value.trim() || '')});
  $('#dl').onclick = e => run(e.target, async () => (await iPdf(type, draft())).save((draft().doc_no || T.title.replace(/ /g, '-') + '-DRAFT') + '.pdf'));
  $('#pv').onclick = e => run(e.target, async () => {
    const w = window.open('', '_blank'); const url = (await iPdf(type, draft())).output('bloburl');
    if (w) w.location = url; else location.href = url;
  });
  $('#del')?.addEventListener('click', e => run(e.target, async () => {
    if (!confirm(`${rec.doc_no} ko hamesha ke liye delete karna hai?`)) return;
    const {error} = await sb.from('docs_documents').delete().eq('id', rec.id);
    if (error) throw error;
    dirty = false; toast(rec.doc_no + ' delete ho gaya'); location.hash = '#' + type;
  }));
  form.addEventListener('submit', e => { e.preventDefault(); if (!ro) run($('#save'), async () => {
    const v = collect();
    if (!v.doc_date) throw new Error('Date daalein.');
    if (!v.party_name) { $('#f_party').focus(); throw new Error('Customer name daalein.'); }
    if (!v.data.items.length) throw new Error('Kam az kam ek item daalein.');
    let res;
    if (rec) res = await sb.from('docs_documents').update(v).eq('id', rec.id).select().single();
    else {
      const manual = $('#f_no').value.trim();
      res = await sb.from('docs_documents').insert({doc_type: type, ...v, ...(manual ? {doc_no: manual} : {})}).select().single();
    }
    if (res.error) throw new Error(res.error.code === '23505' ? 'Yeh number pehle se maujood hai. Number khaali chhor dein ya doosra likhein.' : nice(res.error));
    rec = res.data; dirty = false;
    toast(`${rec.doc_no} save ho gaya`);
    if (location.hash !== `#${type}/${rec.id}`) location.hash = `#${type}/${rec.id}`; else route();
  }); });
}

/* ============================== routing ============================== */
async function route() {
  const h = location.hash.replace(/^#/, '') || 'leak';
  const [type, a, b] = h.split('/');
  if (!['leak', 'dn', 'quotation'].includes(type)) { location.hash = '#leak'; return; }
  $$('#tabs a').forEach(x => x.classList.toggle('on', x.dataset.t === type));
  if (type !== 'leak') {
    if (!a) return showIList(type);
    if (a === 'new') return CAN_EDIT ? showIForm(type) : (location.hash = '#' + type);
    if (a === 'copy') return CAN_EDIT ? showIForm(type, null, b) : (location.hash = '#' + type);
    return showIForm(type, a);
  }
  if (!a) return showList();
  if (a === 'new') return CAN_EDIT ? showForm(null) : (location.hash = '#leak');
  if (a === 'copy') return CAN_EDIT ? showForm(null, b) : (location.hash = '#leak');
  return showForm(a);
}
let lastHash = location.hash, goingBack = false;
window.addEventListener('hashchange', () => {
  if (goingBack) { goingBack = false; return; }
  if (dirty && !confirm('Aapki tabdeeliyan save nahi hui. Phir bhi chhorna hai?')) {
    goingBack = true; location.hash = lastHash; return;
  }
  dirty = false; lastHash = location.hash; route();
});
route();
})();
</script>
