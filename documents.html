<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Documents | Al Hyakel Portal</title>
<link rel="icon" href="assets/favicon.png">
<link rel="stylesheet" href="assets/portal.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="assets/config.js"></script>
<script src="assets/portal.js" data-module="docs"></script>
<style>
main{max-width:1100px}
.doc-head{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:6px}
.doc-tabs{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0 20px;border-bottom:2px solid var(--border)}
.doc-tabs a,.doc-tabs span{padding:8px 14px;text-decoration:none;font-weight:600;font-size:14px;border-bottom:3px solid transparent;margin-bottom:-2px;color:var(--muted)}
.doc-tabs a.on{color:var(--teal-dark);border-bottom-color:var(--orange)}
.doc-tabs span{opacity:.55;cursor:default}
.doc-tabs span small{font-weight:500}
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:end;margin-bottom:14px}
.tools .field{margin:0}
.tools input[type=search]{width:min(340px,100%)}
td .btn{margin-right:4px}
td.no{font:600 14px/1.2 Consolas,Menlo,monospace;color:var(--teal-dark);white-space:nowrap}
.res{display:inline-block;font-size:12px;font-weight:700;padding:2px 9px;border-radius:99px}
.res.PASS{background:#e3f2e9;color:var(--green)}
.res.FAIL{background:#fbe6e4;color:var(--red)}
.empty{padding:34px 18px;text-align:center;color:var(--muted)}
tbody tr.click{cursor:pointer}
tbody tr.click:hover td{background:#f6f9f9}

/* form */
.sheet{background:#fff;border:1px solid var(--border);border-radius:8px;padding:6px 22px 18px;margin-bottom:16px}
.sheet h3{color:var(--teal-dark);font-size:1.05rem;margin:16px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--border)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:2px 18px}
.field input,.field select,.field textarea{width:100%}
textarea{font:inherit;padding:8px 10px;border:1px solid var(--border);border-radius:5px;resize:vertical;min-height:70px}
textarea:focus{outline:2px solid var(--teal);outline-offset:1px}
.fixed{padding:8px 10px;background:#f2f5f5;border:1px dashed var(--border);border-radius:5px;font-weight:600;color:var(--teal-dark)}
.choice{display:flex;gap:18px;flex-wrap:wrap;padding:6px 0}
.choice label{display:flex;align-items:center;gap:7px;font-weight:600;cursor:pointer}
.choice input{width:18px;height:18px;margin:0}
.choice.result label{padding:6px 14px;border:2px solid var(--border);border-radius:6px}
.choice.result label:has(input:checked)[data-v=PASS]{border-color:var(--green);color:var(--green);background:#eef7f1}
.choice.result label:has(input:checked)[data-v=FAIL]{border-color:var(--red);color:var(--red);background:#fdf0ee}
.hint{font-size:13px;color:var(--muted);margin:2px 0 0}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.slot{border:2px dashed var(--border);border-radius:8px;aspect-ratio:4/3;position:relative;display:grid;place-items:center;background:#fafcfc;overflow:hidden}
.slot img{width:100%;height:100%;object-fit:contain;background:#fff}
.slot .lbl{color:var(--muted);font-size:14px;text-align:center;padding:10px}
.slot input{position:absolute;inset:0;opacity:0;cursor:pointer}
.slot .x{position:absolute;top:6px;right:6px;background:#fff;border:1px solid var(--border);border-radius:4px;padding:2px 8px;font-size:13px;cursor:pointer;z-index:2}
.slot.qr{aspect-ratio:1;max-width:220px}
.slot.filled{border-style:solid}
.slot.ro input{display:none}
.bar{position:sticky;bottom:0;background:rgba(242,245,245,.96);border-top:1px solid var(--border);padding:12px 0;display:flex;gap:10px;flex-wrap:wrap;align-items:center;z-index:5}
.bar .grow{flex:1}
.meta{font-size:13px;color:var(--muted)}
.err{margin:0}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--teal-dark);color:#fff;padding:10px 18px;border-radius:6px;font-weight:600;z-index:60;box-shadow:0 6px 20px rgba(0,0,0,.2)}
#toast.bad{background:var(--red)}
.busy{opacity:.6;pointer-events:none}
@media (max-width:600px){main{padding:18px 14px 40px}.sheet{padding:4px 14px 14px}}
</style>
</head>
<body>
<main>
  <div class="doc-head">
    <div><h1>Documents</h1><p class="muted" style="margin:4px 0 0">Certificates aur company documents banayein, save karein aur PDF download karein.</p></div>
    <span class="pill" id="myRole"></span>
  </div>
  <nav class="doc-tabs" aria-label="Document types">
    <a href="#leak" class="on">Leak Test Certificate</a>
    <span title="Agle phase mein">Delivery Note <small>(jaldi)</small></span>
    <span title="Agle phase mein">Quotation <small>(jaldi)</small></span>
    <span title="Agle phase mein">Purchase Order <small>(jaldi)</small></span>
    <span title="Agle phase mein">Tank Certificate <small>(jaldi)</small></span>
  </nav>
  <div id="view"></div>
</main>
<div id="toast" hidden></div>

<script>
(async () => {
/* ============================== setup ============================== */
const U = await window.PORTAL_READY;
const sb = window.portalSb;
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
const view = $('#view');
const ROLE = U.docs_role;                       // manager | staff | viewer
const CAN_EDIT = ROLE === 'manager' || ROLE === 'staff';
const CAN_DELETE = ROLE === 'manager';
$('#myRole').textContent = ROLE;
const BUCKET = 'docs';
const today = () => new Intl.DateTimeFormat('en-CA', {timeZone: 'Asia/Riyadh'}).format(new Date());
const fmtDate = d => d ? new Date(d + 'T00:00:00').toLocaleDateString('en-GB', {day: '2-digit', month: 'short', year: 'numeric'}) : '';

/* Leak test: fixed standards (saved inside each certificate, so old ones never change) */
const LEAK = {
  pressure: '0.30 Bar / 4.2 PSI',
  prv: '0.60 Bar / 8.5 PSI',
  statement: (result, method) => {
    const m = method === 'hydrostatic' ? 'hydrostatic' : 'pneumatic';
    return result === 'FAIL'
      ? `The ${m} leak test was carried out at the required test pressure of ${LEAK.pressure}. Leakage and/or pressure drop was observed during the test. The test is NOT ACCEPTED. The defects must be repaired and the equipment re-tested.`
      : `The ${m} leak test was carried out at the required test pressure of ${LEAK.pressure} for the specified test duration. All welded joints and connections were inspected and no leakage or pressure drop was observed. The test is ACCEPTED as satisfactory.`;
  }
};

let toastT;
function toast(msg, bad) {
  const t = $('#toast'); t.textContent = msg; t.className = bad ? 'bad' : ''; t.hidden = false;
  clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, bad ? 6000 : 3000);
}
const nice = e => (e && (e.message || e.error_description)) || String(e);

/* ============================== data ============================== */
let LIST = null;   // leak certificates (latest first)
async function loadList(force) {
  if (LIST && !force) return LIST;
  const {data, error} = await sb.from('docs_documents')
    .select('id, doc_no, doc_date, party_name, data, files, created_at, updated_at')
    .eq('doc_type', 'leak').order('created_at', {ascending: false}).limit(5000);
  if (error) throw error;
  LIST = data;
  return LIST;
}
const nameOf = (() => { let cache = null;
  return async id => {
    if (!id) return '';
    if (!cache) { const {data} = await sb.from('portal_users').select('id, full_name, username'); cache = Object.fromEntries((data || []).map(u => [u.id, u.full_name || u.username])); }
    return cache[id] || '';
  };
})();
function nextProjectNo() {
  const n = Math.max(0, ...(LIST || []).map(r => parseInt(r.data?.project_no, 10)).filter(Number.isFinite));
  return String(n + 1).padStart(2, '0');
}

/* ============================== images ============================== */
const blobToDataUrl = b => new Promise((ok, no) => { const r = new FileReader(); r.onload = () => ok(r.result); r.onerror = no; r.readAsDataURL(b); });
const loadImg = src => new Promise((ok, no) => { const i = new Image(); i.onload = () => ok(i); i.onerror = () => no(new Error('Image load nahi hui')); i.src = src; });
async function shrink(file, max, type, quality) {
  const img = await loadImg(URL.createObjectURL(file));
  const k = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
  const c = document.createElement('canvas');
  c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
  const g = c.getContext('2d');
  if (type === 'image/jpeg') { g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); }
  g.drawImage(img, 0, 0, c.width, c.height);
  URL.revokeObjectURL(img.src);
  const blob = await new Promise(r => c.toBlob(r, type, quality));
  return {blob, dataUrl: await blobToDataUrl(blob), w: c.width, h: c.height};
}
async function fileFromStorage(path) {
  const {data, error} = await sb.storage.from(BUCKET).download(path);
  if (error) throw error;
  const dataUrl = await blobToDataUrl(data);
  const img = await loadImg(dataUrl);
  return {dataUrl, w: img.naturalWidth, h: img.naturalHeight};
}
let ASSETS = null;
async function assets() {
  if (ASSETS) return ASSETS;
  const get = async p => { const r = await fetch(p); if (!r.ok) throw new Error(p + ' nahi mili'); const d = await blobToDataUrl(await r.blob()); const i = await loadImg(d); return {dataUrl: d, w: i.naturalWidth, h: i.naturalHeight}; };
  const [header, footer, stamp] = await Promise.all(['assets/docs/header.jpg', 'assets/docs/footer.jpg', 'assets/docs/stamp.png'].map(get));
  return ASSETS = {header, footer, stamp};
}

/* ============================== PDF ============================== */
const C = {slate: [46, 88, 104], orange: [221, 107, 42], ink: [28, 36, 40], muted: [110, 122, 128], line: [176, 190, 195], shade: [236, 242, 243], green: [45, 122, 76], red: [179, 38, 30]};

function leakPdf(r, img) {
  const {jsPDF} = window.jspdf;
  const pdf = new jsPDF({unit: 'mm', format: 'a4', compress: true});
  const W = 210, H = 297, M = 12, CW = W - 2 * M;
  const hdrH = CW * img.header.h / img.header.w, ftrH = CW * img.footer.h / img.footer.w;
  const TOP = 5 + hdrH + 5, BOTTOM = H - 5 - ftrH - 4;
  const d = r.data;

  const frame = (page) => {
    pdf.addImage(img.header.dataUrl, 'JPEG', M, 5, CW, hdrH, 'hdr');
    pdf.addImage(img.footer.dataUrl, 'JPEG', M, H - 5 - ftrH, CW, ftrH, 'ftr');
    pdf.setFont('helvetica', 'normal'); pdf.setFontSize(7.5); pdf.setTextColor(...C.muted);
    pdf.text(`${r.doc_no || 'DRAFT'}   |   Page ${page} of 2`, W - M, BOTTOM + 2.5, {align: 'right'});
  };
  const fit = (text, w, size, style = 'normal') => {   // shrink a single line until it fits
    pdf.setFont('helvetica', style); let s = size;
    while (s > 6.5 && pdf.getStringUnitWidth(text) * s / pdf.internal.scaleFactor > w) s -= 0.5;
    pdf.setFontSize(s); return s;
  };
  const title = (t, y, size = 16) => {
    pdf.setFont('helvetica', 'bold'); pdf.setFontSize(size); pdf.setTextColor(...C.slate);
    pdf.text(t, W / 2, y, {align: 'center'});
    const tw = pdf.getTextWidth(t);
    pdf.setDrawColor(...C.orange); pdf.setLineWidth(0.8); pdf.line(W / 2 - tw / 2, y + 2.2, W / 2 + tw / 2, y + 2.2);
  };
  const band = (t, y) => {
    pdf.setFillColor(...C.slate); pdf.rect(M, y, CW, 7, 'F');
    pdf.setFont('helvetica', 'bold'); pdf.setFontSize(9.5); pdf.setTextColor(255, 255, 255);
    pdf.text(t, M + 3, y + 4.8);
    return y + 7;
  };
  const LW = 40;                       // label column
  const VW2 = (CW - 2 * LW) / 2;       // value column when two pairs share a row
  const cell = (x, y, w, h, label, value, opts = {}) => {
    pdf.setDrawColor(...C.line); pdf.setLineWidth(0.25);
    if (label != null) {
      pdf.setFillColor(...C.shade); pdf.rect(x, y, LW, h, 'FD');
      pdf.setTextColor(...C.slate); fit(label, LW - 4, 9, 'bold');
      pdf.text(label, x + 2.5, y + h / 2, {baseline: 'middle'});
      x += LW; w -= LW;
    }
    pdf.rect(x, y, w, h, 'S');
    if (opts.draw) return opts.draw(x, y, w, h);
    pdf.setTextColor(...C.ink); pdf.setFont('helvetica', 'normal');
    const v = String(value ?? '').trim() || '-';
    pdf.setFontSize(10);
    let lines = pdf.splitTextToSize(v, w - 5);
    if (lines.length > 1) { pdf.setFontSize(9); lines = pdf.splitTextToSize(v, w - 5).slice(0, Math.max(1, Math.floor((h - 2) / 4))); }
    pdf.text(lines, x + 2.5, y + h / 2 - (lines.length - 1) * 1.9, {baseline: 'middle'});
  };
  const pair = (y, h, a, b) => { cell(M, y, LW + VW2, h, a[0], a[1]); cell(M + LW + VW2, y, LW + VW2, h, b[0], b[1]); return y + h; };
  const wide = (y, h, label, value, opts) => { cell(M, y, CW, h, label, value, opts); return y + h; };
  const box = (x, y, on) => {
    pdf.setDrawColor(...C.ink); pdf.setLineWidth(0.35); pdf.rect(x, y, 4.2, 4.2, 'S');
    if (on) { pdf.setLineWidth(0.7); pdf.setDrawColor(...C.slate); pdf.line(x + 0.8, y + 2.2, x + 1.8, y + 3.4); pdf.line(x + 1.8, y + 3.4, x + 3.6, y + 0.8); }
  };

  /* ---------------- page 1 ---------------- */
  frame(1);
  let y = TOP + 6;
  title('LEAK TEST INSPECTION CERTIFICATE', y);
  y += 9;
  const GAP = 5, BANDS = 4 * 7, UNITS = 8 + 2.6 + 2;          // 8 rows, result block, remarks block
  const rowH = Math.min(12, (BOTTOM - y - BANDS - 3 * GAP) / UNITS);
  y = band('REPORT INFORMATION', y);
  y = pair(y, rowH, ['Test No.', r.doc_no || '(on save)'], ['Report Date', fmtDate(r.doc_date)]);
  y = pair(y, rowH, ['Project No.', d.project_no], ['Project Name', d.project_name]);
  y = wide(y, rowH, 'Client Name', r.party_name);
  y = wide(y, rowH, 'Equipment Tag / No.', d.equipment_tag);
  y += GAP;
  y = band('TEST DETAILS', y);
  y = wide(y, rowH, 'Test Method', '', {draw: (x, yy, w, h) => {
    const cy = yy + h / 2;
    [['Pneumatic', 'pneumatic'], ['Hydrostatic', 'hydrostatic']].forEach(([t, k], i) => {
      const bx = x + 4 + i * 45;
      box(bx, cy - 2.1, d.test_method === k);
      pdf.setFont('helvetica', d.test_method === k ? 'bold' : 'normal'); pdf.setFontSize(10); pdf.setTextColor(...C.ink);
      pdf.text(t, bx + 6.5, cy, {baseline: 'middle'});
    });
  }});
  y = pair(y, rowH, ['Test Medium', d.test_medium], ['Test Duration', d.test_duration]);
  y = pair(y, rowH, ['Required Test Pressure', d.test_pressure || LEAK.pressure], ['Safety Setting (PRV)', d.prv || LEAK.prv]);
  y = wide(y, rowH, 'Ambient Temperature', d.ambient_temp);
  y += GAP;
  y = band('TEST RESULT', y);
  const resH = rowH * 2.6;
  const pass = d.result !== 'FAIL';
  y = wide(y, resH, 'Result', '', {draw: (x, yy, w, h) => {
    const rw = 34;
    pdf.setFillColor(...(pass ? [233, 245, 238] : [252, 235, 233])); pdf.rect(x, yy, rw, h, 'FD');
    pdf.setFont('helvetica', 'bold'); pdf.setFontSize(20); pdf.setTextColor(...(pass ? C.green : C.red));
    pdf.text(pass ? 'PASS' : 'FAIL', x + rw / 2, yy + h / 2, {align: 'center', baseline: 'middle'});
    pdf.setFont('helvetica', 'normal'); pdf.setTextColor(...C.ink);
    const tw = w - rw - 6; let s = 10, lines;
    do { pdf.setFontSize(s); lines = pdf.splitTextToSize(d.statement || '', tw); s -= 0.5; } while (lines.length * s * 0.43 > h - 3 && s > 7);
    const lh = (s + 0.5) * 0.43;
    pdf.text(lines, x + rw + 3, yy + h / 2 - (lines.length - 1) * lh / 2, {baseline: 'middle', lineHeightFactor: 1.2});
  }});
  y += GAP;
  y = band('REMARKS', y);
  const remH = BOTTOM - y - 1;
  pdf.setDrawColor(...C.line); pdf.setLineWidth(0.25); pdf.rect(M, y, CW, remH, 'S');
  pdf.setFont('helvetica', 'normal'); pdf.setFontSize(10); pdf.setTextColor(...C.ink);
  pdf.text(pdf.splitTextToSize(String(d.remarks || '').trim() || '-', CW - 6).slice(0, Math.floor((remH - 4) / 4.5)), M + 3, y + 5.5, {lineHeightFactor: 1.3});

  /* ---------------- page 2 ---------------- */
  pdf.addPage(); frame(2);
  y = TOP + 6;
  title('TEST PHOTOGRAPHS', y, 14);
  y += 6;
  const info = [`Test No: ${r.doc_no || '(on save)'}`, d.project_name && `Project: ${d.project_name}`, r.party_name && `Client: ${r.party_name}`].filter(Boolean).join('    |    ');
  pdf.setTextColor(...C.muted); fit(info, CW, 9);
  pdf.text(info, W / 2, y, {align: 'center'});
  y += 5;
  const SIGN_H = 52, PG = 5;
  const ph = (BOTTOM - SIGN_H - y - PG) / 2, pw = (CW - PG) / 2;
  (img.photos || []).slice(0, 4).forEach((p, i) => {
    const x = M + (i % 2) * (pw + PG), yy = y + Math.floor(i / 2) * (ph + PG);
    pdf.setDrawColor(...C.line); pdf.setLineWidth(0.3); pdf.rect(x, yy, pw, ph, 'S');
    if (p) {
      const k = Math.min((pw - 4) / p.w, (ph - 4) / p.h), iw = p.w * k, ih = p.h * k;
      pdf.addImage(p.dataUrl, 'JPEG', x + (pw - iw) / 2, yy + (ph - ih) / 2, iw, ih, 'ph' + i);
    }
    pdf.setFillColor(...C.slate); pdf.rect(x, yy, 7, 6, 'F');
    pdf.setFont('helvetica', 'bold'); pdf.setFontSize(9); pdf.setTextColor(255, 255, 255);
    pdf.text(String(i + 1), x + 3.5, yy + 3.1, {align: 'center', baseline: 'middle'});
  });
  // signature (left) | stamp + QR (right)
  const by = BOTTOM - SIGN_H + 4;
  const QR = 42, qx = W - M - QR, qy = by + 2;
  pdf.setDrawColor(...C.line); pdf.setLineWidth(0.3); pdf.rect(qx, qy, QR, QR, 'S');
  if (img.qr) { const k = Math.min((QR - 2) / img.qr.w, (QR - 2) / img.qr.h); pdf.addImage(img.qr.dataUrl, 'PNG', qx + (QR - img.qr.w * k) / 2, qy + (QR - img.qr.h * k) / 2, img.qr.w * k, img.qr.h * k, 'qr'); }
  const SW = 50, SH = 25;           // real stamp size 50 x 25 mm
  const sk = Math.min(SW / img.stamp.w, SH / img.stamp.h);
  const sw = img.stamp.w * sk, sh = img.stamp.h * sk;
  pdf.addImage(img.stamp.dataUrl, 'PNG', qx - 6 - SW + (SW - sw) / 2, qy + (QR - sh) / 2, sw, sh, 'stamp');
  const sy = qy + QR - 4;
  pdf.setDrawColor(...C.ink); pdf.setLineWidth(0.4); pdf.line(M, sy, M + 70, sy);
  pdf.setFont('helvetica', 'bold'); pdf.setFontSize(9.5); pdf.setTextColor(...C.slate);
  pdf.text('Authorized Signature', M, sy + 5);
  pdf.setFont('helvetica', 'normal'); pdf.setFontSize(8.5); pdf.setTextColor(...C.muted);
  pdf.text('Al Hyakel Metal Industries', M, sy + 9.5);
  return pdf;
}

async function pdfFor(rec, photos, qr) {
  return leakPdf(rec, {...await assets(), photos, qr});
}

/* ============================== list ============================== */
async function showList() {
  view.innerHTML = '<p class="muted">Load ho raha hai…</p>';
  try { await loadList(true); } catch (e) { view.innerHTML = `<p class="flash">Database error: ${esc(nice(e))}. Kya <b>supabase_docs.sql</b> chal chuki hai?</p>`; return; }
  view.innerHTML = `
    <div class="tools">
      <div class="field"><label for="q">Search</label><input id="q" type="search" placeholder="Test no, project, client, equipment"></div>
      <div class="field"><label for="fr">Result</label><select id="fr"><option value="">All</option><option>PASS</option><option>FAIL</option></select></div>
      <span style="flex:1"></span>
      ${CAN_EDIT ? '<a class="btn" href="#leak/new">+ New certificate</a>' : ''}
    </div>
    <div class="table-wrap"><table><thead><tr><th>Test No.</th><th>Date</th><th>Project</th><th>Client</th><th>Equipment</th><th>Result</th><th></th></tr></thead><tbody id="rows"></tbody></table></div>
    <p class="muted" id="count" style="font-size:13px"></p>`;
  const draw = () => {
    const q = $('#q').value.trim().toLowerCase(), fr = $('#fr').value;
    const rows = LIST.filter(r => (!fr || r.data?.result === fr) &&
      (!q || [r.doc_no, r.party_name, r.data?.project_no, r.data?.project_name, r.data?.equipment_tag].join(' ').toLowerCase().includes(q)));
    $('#rows').innerHTML = rows.length ? rows.map(r => `<tr class="click" data-id="${r.id}">
        <td class="no">${esc(r.doc_no)}</td><td style="white-space:nowrap">${esc(fmtDate(r.doc_date))}</td>
        <td>${r.data?.project_no ? `<b>${esc(r.data.project_no)}</b> ` : ''}${esc(r.data?.project_name)}</td>
        <td>${esc(r.party_name)}</td><td>${esc(r.data?.equipment_tag)}</td>
        <td><span class="res ${r.data?.result === 'FAIL' ? 'FAIL' : 'PASS'}">${r.data?.result === 'FAIL' ? 'FAIL' : 'PASS'}</span></td>
        <td style="white-space:nowrap"><button class="btn small sec" data-pdf="${r.id}">PDF</button></td></tr>`).join('')
      : `<tr><td colspan="7" class="empty">${LIST.length ? 'Is search se koi certificate nahi mila.' : 'Abhi tak koi certificate nahi bana.' + (CAN_EDIT ? ' <a href="#leak/new">Pehla certificate banayein</a>.' : '')}</td></tr>`;
    $('#count').textContent = LIST.length ? `${rows.length} of ${LIST.length} certificates` : '';
  };
  $('#q').addEventListener('input', draw); $('#fr').addEventListener('change', draw);
  $('#rows').addEventListener('click', async e => {
    const b = e.target.closest('[data-pdf]');
    if (b) {
      e.stopPropagation(); b.disabled = true; b.textContent = '…';
      try { const r = LIST.find(x => x.id === b.dataset.pdf); const f = await recordFiles(r); (await pdfFor(r, f.photos, f.qr)).save(r.doc_no + '.pdf'); }
      catch (err) { toast('PDF nahi bani: ' + nice(err), true); }
      b.disabled = false; b.textContent = 'PDF'; return;
    }
    const tr = e.target.closest('tr[data-id]'); if (tr) location.hash = '#leak/' + tr.dataset.id;
  });
  draw();
}
async function recordFiles(r) {
  const f = r.files || {};
  const photos = await Promise.all([0, 1, 2, 3].map(i => f.photos?.[i] ? fileFromStorage(f.photos[i]).catch(() => null) : null));
  const qr = f.qr ? await fileFromStorage(f.qr).catch(() => null) : null;
  return {photos, qr};
}

/* ============================== form ============================== */
let dirty = false;
window.addEventListener('beforeunload', e => { if (dirty) { e.preventDefault(); e.returnValue = ''; } });

async function showForm(id, copyFrom) {
  view.innerHTML = '<p class="muted">Load ho raha hai…</p>';
  try { await loadList(); } catch (e) { view.innerHTML = `<p class="flash">Database error: ${esc(nice(e))}</p>`; return; }
  let rec = null;
  if (id) {
    const {data, error} = await sb.from('docs_documents').select('*').eq('id', id).maybeSingle();
    if (error || !data) { view.innerHTML = `<p class="flash">Certificate nahi mila. <a href="#leak">Wapas list par</a></p>`; return; }
    rec = data;
  }
  let src = rec;
  if (copyFrom) {
    const {data} = await sb.from('docs_documents').select('*').eq('id', copyFrom).maybeSingle();
    src = data ? {data: data.data, party_name: data.party_name} : null;
  }
  const ro = !CAN_EDIT;
  const d = {test_method: 'pneumatic', test_medium: 'Air', result: 'PASS', ...(src?.data || {})};
  if (!rec) { d.project_no = copyFrom ? d.project_no : nextProjectNo(); }
  if (!d.statement) d.statement = LEAK.statement(d.result, d.test_method);
  let statementAuto = d.statement === LEAK.statement(d.result, d.test_method);

  // files: 4 photos + qr. Each slot: {path, dataUrl, w, h, blob, changed}
  const slots = [0, 1, 2, 3].map(() => null);
  let qr = null;
  if (rec) {
    const f = await recordFiles(rec);
    f.photos.forEach((p, i) => { if (p) slots[i] = {...p, path: rec.files.photos[i]}; });
    if (f.qr) qr = {...f.qr, path: rec.files.qr};
  }
  const who = rec ? `Banaya: ${esc(await nameOf(rec.created_by))} · ${new Date(rec.created_at).toLocaleString('en-GB', {dateStyle: 'medium', timeStyle: 'short'})}` +
    (rec.updated_at ? ` &nbsp;|&nbsp; Akhri tabdeeli: ${esc(await nameOf(rec.updated_by))} · ${new Date(rec.updated_at).toLocaleString('en-GB', {dateStyle: 'medium', timeStyle: 'short'})}` : '') : '';
  const dis = ro ? 'disabled' : '';
  const clients = [...new Set(LIST.map(r => r.party_name).filter(Boolean))].sort();

  view.innerHTML = `
    <p style="margin:0 0 10px"><a href="#leak">&larr; Leak Test Certificates</a></p>
    <h2>${rec ? `Leak Test Certificate <span class="mono" style="font-size:1.1rem">${esc(rec.doc_no)}</span>` : 'New Leak Test Certificate'}</h2>
    ${who ? `<p class="meta">${who}</p>` : ''}
    <form id="f" autocomplete="off">
      <div class="sheet">
        <h3>Report information</h3>
        <div class="grid">
          <div class="field"><label>Test No.</label><div class="fixed">${rec ? esc(rec.doc_no) : 'Save karne par milega (TS-…)'}</div></div>
          <div class="field"><label for="doc_date">Report Date</label><input id="doc_date" type="date" required value="${esc(rec?.doc_date || today())}" ${dis}></div>
          <div class="field"><label for="project_no">Project No.</label><input id="project_no" value="${esc(d.project_no)}" ${dis}></div>
          <div class="field"><label for="project_name">Project Name</label><input id="project_name" value="${esc(d.project_name)}" ${dis}></div>
          <div class="field"><label for="party_name">Client Name</label><input id="party_name" list="clients" required value="${esc(src?.party_name)}" ${dis}><datalist id="clients">${clients.map(c => `<option value="${esc(c)}">`).join('')}</datalist></div>
          <div class="field"><label for="equipment_tag">Equipment Tag / No.</label><input id="equipment_tag" value="${esc(d.equipment_tag)}" ${dis}></div>
        </div>
        <h3>Test details</h3>
        <div class="field"><label>Test Method</label>
          <div class="choice">${[['pneumatic', 'Pneumatic'], ['hydrostatic', 'Hydrostatic']].map(([v, t]) => `<label><input type="radio" name="test_method" value="${v}" ${d.test_method === v ? 'checked' : ''} ${dis}> ${t}</label>`).join('')}</div></div>
        <div class="grid">
          <div class="field"><label for="test_medium">Test Medium</label><input id="test_medium" list="media" value="${esc(d.test_medium)}" ${dis}><datalist id="media"><option value="Air"><option value="Nitrogen"><option value="Water"></datalist></div>
          <div class="field"><label for="test_duration">Test Duration</label><input id="test_duration" placeholder="e.g. 30 minutes" value="${esc(d.test_duration)}" ${dis}></div>
          <div class="field"><label for="ambient_temp">Ambient Temperature</label><input id="ambient_temp" placeholder="e.g. 34 °C" value="${esc(d.ambient_temp)}" ${dis}></div>
          <div class="field"><label>Required Test Pressure</label><div class="fixed">${esc(d.test_pressure || LEAK.pressure)}</div></div>
          <div class="field"><label>Safety Setting (PRV)</label><div class="fixed">${esc(d.prv || LEAK.prv)}</div></div>
        </div>
        <h3>Test result</h3>
        <div class="choice result">${['PASS', 'FAIL'].map(v => `<label data-v="${v}"><input type="radio" name="result" value="${v}" ${d.result === v ? 'checked' : ''} ${dis}> ${v}</label>`).join('')}</div>
        <div class="field" style="margin-top:10px"><label for="statement">Result statement</label><textarea id="statement" rows="3" ${dis}>${esc(d.statement)}</textarea>
          ${ro ? '' : '<p class="hint">PASS / FAIL badalne par yeh khud badal jata hai. Aap isay edit bhi kar sakte hain.</p>'}</div>
        <div class="field"><label for="remarks">Remarks</label><textarea id="remarks" rows="3" ${dis}>${esc(d.remarks)}</textarea></div>
      </div>
      <div class="sheet">
        <h3>Photos (page 2)</h3>
        <div class="photos" id="photos"></div>
        <h3>QR code</h3>
        <div id="qrslot"></div>
        <p class="hint">Apna QR code PNG/JPG image upload karein. Yeh page 2 par stamp ke saath lagega.</p>
      </div>
      <p class="err" id="err" role="alert"></p>
      <div class="bar">
        ${ro ? '' : `<button class="btn" id="save" type="submit">Save</button>`}
        <button class="btn sec" type="button" id="dl">Download PDF</button>
        <button class="btn sec" type="button" id="pv">Preview</button>
        ${rec && CAN_EDIT ? `<a class="btn sec" href="#leak/copy/${rec.id}">Copy as new</a>` : ''}
        <span class="grow"></span>
        ${rec && CAN_DELETE ? '<button class="btn danger" type="button" id="del">Delete</button>' : ''}
      </div>
    </form>`;

  const form = $('#f');
  const slotHtml = (s, label, i, cls = '') => `<div class="slot ${cls} ${s ? 'filled' : ''} ${ro ? 'ro' : ''}" data-i="${i}">
      ${s ? `<img src="${s.dataUrl}" alt="${esc(label)}">` : `<span class="lbl">${ro ? 'Koi image nahi' : '+ ' + esc(label) + '<br><small>click karke chunein</small>'}</span>`}
      ${s && !ro ? `<button type="button" class="x" data-x="${i}" aria-label="Remove ${esc(label)}">Remove</button>` : ''}
      <input type="file" accept="image/*" aria-label="${esc(label)}" ${ro ? 'disabled' : ''}></div>`;
  const removed = new Set();     // storage paths to delete after save
  const drawSlots = () => {
    $('#photos').innerHTML = slots.map((s, i) => slotHtml(s, 'Photo ' + (i + 1), i)).join('');
    $('#qrslot').innerHTML = slotHtml(qr, 'QR code', 'qr', 'qr');
  };
  drawSlots();
  form.addEventListener('change', async e => {
    if (e.target.type !== 'file') return;
    const file = e.target.files[0]; if (!file) return;
    const i = e.target.closest('.slot').dataset.i;
    try {
      const isQr = i === 'qr';
      const img = await shrink(file, isQr ? 800 : 1000, isQr ? 'image/png' : 'image/jpeg', 0.7);
      const old = isQr ? qr : slots[i];
      if (old?.path) removed.add(old.path);
      const s = {...img, changed: true};
      if (isQr) qr = s; else slots[i] = s;
      dirty = true; drawSlots();
    } catch (err) { toast('Yeh image nahi khul saki: ' + nice(err), true); }
  });
  form.addEventListener('click', e => {
    const x = e.target.closest('[data-x]'); if (!x) return;
    const i = x.dataset.x, old = i === 'qr' ? qr : slots[i];
    if (old?.path) removed.add(old.path);
    if (i === 'qr') qr = null; else slots[i] = null;
    dirty = true; drawSlots();
  });
  form.addEventListener('input', e => { dirty = true; if (e.target.id === 'statement') statementAuto = false; });
  form.addEventListener('change', e => {
    if (e.target.name === 'result' || e.target.name === 'test_method') {
      if (statementAuto) $('#statement').value = LEAK.statement(form.result.value, form.test_method.value);
    }
  });

  const collect = () => ({
    doc_date: $('#doc_date').value,
    party_name: $('#party_name').value.trim(),
    data: {
      project_no: $('#project_no').value.trim(), project_name: $('#project_name').value.trim(),
      equipment_tag: $('#equipment_tag').value.trim(), test_method: form.test_method.value,
      test_medium: $('#test_medium').value.trim(), test_duration: $('#test_duration').value.trim(),
      ambient_temp: $('#ambient_temp').value.trim(),
      test_pressure: d.test_pressure || LEAK.pressure, prv: d.prv || LEAK.prv,
      result: form.result.value, statement: $('#statement').value.trim(), remarks: $('#remarks').value.trim()
    }
  });
  const makePdf = async () => {
    const v = collect();
    return pdfFor({...v, doc_no: rec?.doc_no}, slots, qr);
  };
  const run = async (btn, fn) => { const t = btn.textContent; btn.disabled = true; btn.textContent = 'Ruko…'; $('#err').textContent = '';
    try { await fn(); } catch (e) { $('#err').textContent = nice(e); } btn.disabled = false; btn.textContent = t; };

  $('#dl').onclick = e => run(e.target, async () => (await makePdf()).save((rec?.doc_no || 'Leak-Test-DRAFT') + '.pdf'));
  $('#pv').onclick = e => run(e.target, async () => {
    const w = window.open('', '_blank');
    const url = (await makePdf()).output('bloburl');
    if (w) w.location = url; else location.href = url;
  });
  $('#del')?.addEventListener('click', e => run(e.target, async () => {
    if (!confirm(`${rec.doc_no} ko hamesha ke liye delete karna hai?`)) return;
    const {error} = await sb.from('docs_documents').delete().eq('id', rec.id);
    if (error) throw error;
    const paths = [...(rec.files?.photos || []), rec.files?.qr].filter(Boolean);
    if (paths.length) await sb.storage.from(BUCKET).remove(paths);
    dirty = false; LIST = null; toast(rec.doc_no + ' delete ho gaya'); location.hash = '#leak';
  }));

  form.addEventListener('submit', e => { e.preventDefault(); if (!ro) run($('#save'), save); });
  async function save() {
    const v = collect();
    if (!v.doc_date) throw new Error('Report date daalein.');
    if (!v.party_name) { $('#party_name').focus(); throw new Error('Client name daalein.'); }
    let row = rec;
    if (!row) {
      const {data, error} = await sb.from('docs_documents').insert({doc_type: 'leak', ...v}).select().single();
      if (error) throw error;
      row = rec = data;
    } else {
      const {data, error} = await sb.from('docs_documents').update(v).eq('id', row.id).select().single();
      if (error) throw error;
      row = rec = data;
    }
    // upload new images, then store their paths
    const stamp = Date.now();
    const up = async (s, name, type) => {
      if (!s) return null;
      if (!s.changed) return s.path;
      const path = `leak/${row.id}/${name}-${stamp}.${type === 'image/png' ? 'png' : 'jpg'}`;
      const {error} = await sb.storage.from(BUCKET).upload(path, s.blob, {contentType: type, upsert: true});
      if (error) throw new Error('Image upload nahi hui: ' + nice(error) + '. Dobara Save dabayein.');
      s.path = path; s.changed = false;
      return path;
    };
    const photos = [];
    for (let i = 0; i < 4; i++) photos.push(await up(slots[i], 'photo' + (i + 1), 'image/jpeg'));
    const files = {photos, qr: await up(qr, 'qr', 'image/png')};
    const {data, error} = await sb.from('docs_documents').update({files}).eq('id', row.id).select().single();
    if (error) throw error;
    rec = data;
    if (removed.size) { await sb.storage.from(BUCKET).remove([...removed]); removed.clear(); }
    dirty = false; LIST = null;
    toast(`${rec.doc_no} save ho gaya`);
    if (location.hash !== '#leak/' + rec.id) location.hash = '#leak/' + rec.id; else route();
  }
}

/* ============================== routing ============================== */
async function route() {
  const h = location.hash.replace(/^#/, '') || 'leak';
  const [type, a, b] = h.split('/');
  if (type !== 'leak') { location.hash = '#leak'; return; }
  if (!a) return showList();
  if (a === 'new') return CAN_EDIT ? showForm(null) : (location.hash = '#leak');
  if (a === 'copy') return CAN_EDIT ? showForm(null, b) : (location.hash = '#leak');
  return showForm(a);
}
let lastHash = location.hash, goingBack = false;
window.addEventListener('hashchange', () => {
  if (goingBack) { goingBack = false; return; }
  if (dirty && !confirm('Aapki tabdeeliyan save nahi hui. Phir bhi chhorna hai?')) {
    goingBack = true; location.hash = lastHash; return;
  }
  dirty = false; lastHash = location.hash; route();
});
route();
})();
</script>
</body>
</html>
