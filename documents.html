  const dateNow = rec?.doc_date || today(), stLine = await approvalLine(rec);
  const names = [...new Set([...list, ...invoices, ...others].map(x => x.party_name).filter(Boolean))].sort();
  const bal = inv => r2((Number(inv.data?.grand_total) || 0) - (inv.paid || 0)) + (rec && d.invoice_id === inv.id ? Number(d.amount || 0) : 0);
  const who = rec ? `Created by: ${esc(await nameOf(rec.created_by))} · ${new Date(rec.created_at).toLocaleString('en-GB', {dateStyle: 'medium', timeStyle: 'short'})}` : '';
  if (seq !== ROUTE_SEQ) return;
  view.innerHTML = `
    <p style="margin:0 0 10px"><a href="#receipt">&larr; Cash Receipts</a></p>
    <h2>${rec ? `Cash Receipt <span class="mono" style="font-size:1.1rem">${esc(rec.doc_no)}</span>` : 'New Cash Receipt'}</h2>
    ${who ? `<p class="meta">${who}</p>` : ''}${stLine ? `<p class="status-line">${stLine}</p>` : ''}
    <form id="f" autocomplete="off">
      <div class="sheet">
        <h3>Receipt</h3>
        <div class="grid">
          <div class="field"><label for="f_no">Receipt No.</label>${rec ? `<div class="fixed">${esc(rec.doc_no)}</div>` : `<input id="f_no" placeholder="Auto: ${esc(T.nextNo(list, dateNow))}" ${dis}>`}</div>
          <div class="field"><label for="f_date">Date</label><input id="f_date" type="date" required value="${esc(dateNow)}" ${dis}></div>
          <div class="field" style="grid-column:1/-1"><label for="f_party">Received from</label><input id="f_party" list="names" required value="${esc(src?.party_name)}" ${dis}>
            <datalist id="names">${names.map(n => `<option value="${esc(n)}">`).join('')}</datalist></div>
          <div class="field"><label for="f_amount">Amount (SAR)</label><input id="f_amount" type="number" min="0.01" step="0.01" required value="${esc(d.amount)}" ${dis}></div>
          <div class="field"><label for="f_method">Paid by</label><select id="f_method" ${dis}>${RCPT_METHODS.map(m => `<option${m === d.method ? ' selected' : ''}>${m}</option>`).join('')}</select></div>
          <div class="field"><label for="f_reference">Cheque / transfer No.</label><input id="f_reference" value="${esc(d.reference)}" ${dis}></div>
          <div class="field"><label for="f_bank">Bank</label><input id="f_bank" value="${esc(d.bank)}" placeholder="e.g. Al Rajhi Bank" ${dis}></div>
        </div>
        <p class="hint" id="words"></p>
        <div class="grid">
          <div class="field"><label for="f_invoice">Against invoice (optional)</label><select id="f_invoice" ${dis}></select></div>
          <div class="field"><label for="f_purpose">Being (for)</label><input id="f_purpose" value="${esc(d.purpose)}" placeholder="e.g. Advance for tank fabrication" ${dis}></div>
        </div>
        ${ro ? '' : '<p class="hint">Choose an invoice to record this money as a payment on it too (it then shows in that invoice&#39;s Payments and in Receivables).</p>'}
      </div>
      <p class="err" id="err" role="alert"></p>
      <div class="bar">
        ${ro ? '' : '<button class="btn" id="save" type="submit">Save</button><button class="btn sec" id="saveNew" type="button" title="Save, then start a new one">Save &amp; New</button>'}
        <button class="btn sec" type="button" id="dl">Download PDF</button>
        <button class="btn sec" type="button" id="pv">Preview</button>
        <span class="share"><button class="btn sec" type="button" id="sh">Share</button></span>
        ${rec && CAN_EDIT ? `<a class="btn sec" href="#receipt/copy/${rec.id}">Copy as new</a>` : ''}
        ${approvalButtons(rec)}
        <span class="grow"></span>
        ${rec && CAN_DELETE ? '<button class="btn danger" type="button" id="del">Delete</button>' : ''}
      </div>
    </form>`;
  wireApproval(rec, type);
  const form = $('#f');
  const drawInvoices = () => {
    const p = $('#f_party').value.trim().toLowerCase(), cur = $('#f_invoice').value || d.invoice_id;
    const opts = invoices.filter(i => i.id === cur || ((i.party_name || '').trim().toLowerCase() === p && bal(i) > 0.005));
    $('#f_invoice').innerHTML = `<option value="">Not linked to an invoice</option>` + opts.map(i => `<option value="${i.id}"${i.id === cur ? ' selected' : ''}>${esc(i.doc_no)}, balance SAR ${money(bal(i))}</option>`).join('');
  };
  const drawWords = () => { const a = Number($('#f_amount').value); $('#words').textContent = a > 0 ? sarWords(a) : ''; };
  drawInvoices(); drawWords();
  form.addEventListener('input', e => { dirty = true; if (e.target.id === 'f_amount') drawWords(); });
  $('#f_party').addEventListener('change', drawInvoices);
  $('#f_invoice').addEventListener('change', () => { const inv = invoices.find(i => i.id === $('#f_invoice').value);
    if (inv && !$('#f_amount').value) { $('#f_amount').value = bal(inv).toFixed(2); drawWords(); }
    if (inv && !$('#f_purpose').value.trim()) $('#f_purpose').value = 'Payment';
  });
  const collect = () => { const inv = invoices.find(i => i.id === $('#f_invoice').value);
    return {doc_date: $('#f_date').value, party_name: $('#f_party').value.trim(), data: {amount: r2(Number($('#f_amount').value) || 0), method: $('#f_method').value,
      reference: $('#f_reference').value.trim(), bank: $('#f_bank').value.trim(), purpose: $('#f_purpose').value.trim(),
      invoice_id: inv ? inv.id : null, invoice_no: inv ? inv.doc_no : null, payment_id: rec?.data?.payment_id || null}}; };
  const draft = () => ({...collect(), doc_no: rec?.doc_no || ($('#f_no')?.value.trim() || '')});
  const run = async (btn, fn) => { const t = btn.textContent; btn.disabled = true; btn.textContent = 'Please wait…'; $('#err').textContent = '';
    try { await fn(); } catch (e) { $('#err').textContent = nice(e); } btn.disabled = false; btn.textContent = t; };
  const name = () => (draft().doc_no || 'Cash-Receipt-DRAFT') + '.pdf';
  $('#dl').onclick = e => run(e.target, async () => (await iPdf(type, draft())).save(name()));
  wireShare($('#sh'), () => iPdf(type, draft()), name, () => { const v = draft(); return `Cash Receipt ${v.doc_no || ''} - ${v.party_name} - SAR ${money(v.data.amount)}`; });
  $('#pv').onclick = e => run(e.target, async () => { const w = window.open('', '_blank'); const url = (await iPdf(type, draft())).output('bloburl'); if (w) w.location = url; else location.href = url; });
  $('#del')?.addEventListener('click', e => run(e.target, async () => {
    if (!confirm(`Permanently delete ${rec.doc_no}?${rec.data?.payment_id ? ' Its payment on ' + rec.data.invoice_no + ' will be deleted too.' : ''}`)) return;
    if (rec.data?.payment_id) { const {error} = await sb.from('docs_payments').delete().eq('id', rec.data.payment_id); if (error) throw error; }
    const {error} = await sb.from('docs_documents').delete().eq('id', rec.id); if (error) throw error;
    ILIST.invoice = null; dirty = false; toast(rec.doc_no + ' deleted'); location.hash = '#receipt';
  }));
  form.addEventListener('submit', e => { e.preventDefault(); if (!ro) run($('#save'), async () => {
    const v = collect(), x = v.data, old = rec?.data || {};
    if (!v.doc_date) throw new Error('Please enter the date.');
    if (!v.party_name) { $('#f_party').focus(); throw new Error('Please enter who the money was received from.'); }
    if (!(x.amount > 0)) { $('#f_amount').focus(); throw new Error('Please enter the amount.'); }
    const linkChanged = old.payment_id && (old.invoice_id !== x.invoice_id || Number(old.amount) !== x.amount || rec.doc_date !== v.doc_date || old.method !== x.method);
    if (linkChanged && !CAN_DELETE) throw new Error('This receipt is recorded as a payment on ' + old.invoice_no + '. Only a manager can change its amount, date, method or invoice.');
    if (x.invoice_id && !old.payment_id) { const inv = invoices.find(i => i.id === x.invoice_id);
      if (inv && x.amount > bal(inv) + 0.005 && !confirm(`This is more than the invoice balance (SAR ${money(bal(inv))}). Save anyway?`)) return; }
    let res;
    if (rec) res = await sb.from('docs_documents').update(v).eq('id', rec.id).select().single();
    else { const manual = $('#f_no').value.trim(); res = await sb.from('docs_documents').insert({doc_type: type, ...v, ...(manual ? {doc_no: manual} : {})}).select().single(); }
    if (res.error) throw new Error(res.error.code === '23505' ? 'This number already exists. Leave it blank or enter a different one.' : nice(res.error));
    rec = res.data;
    // keep the invoice payment in step with the receipt
    let pid = old.payment_id || null;
    if (pid && (linkChanged || !x.invoice_id)) { const {error} = await sb.from('docs_payments').delete().eq('id', pid); if (error) throw error; pid = null; }
    if (x.invoice_id && !pid) {
      const {data: pay, error} = await sb.from('docs_payments').insert({document_id: x.invoice_id, paid_on: v.doc_date, amount: x.amount, method: x.method, reference: rec.doc_no}).select().single();
      if (error) throw new Error('Receipt saved, but the invoice payment could not be recorded: ' + nice(error));
      pid = pay.id;
    }
    if (pid !== (rec.data?.payment_id || null)) { const up = await sb.from('docs_documents').update({data: {...rec.data, payment_id: pid}}).eq('id', rec.id).select().single(); if (!up.error) rec = up.data; }
    ILIST.invoice = null; dirty = false; toast(`${rec.doc_no} saved`);
    goAfterSave(type, rec.id);
  }); });
}

/* ============================== invoice payments panel ============================== */
async function drawPayments(rec) {
  const box = $('#pays'); if (!box) return;
  const {data, error} = await sb.from('docs_payments').select('*').eq('document_id', rec.id).order('paid_on');
  if (error) { box.innerHTML = '<h3>Payments</h3><p class="flash">Payments table not found. Run the latest <b>supabase_docs.sql</b> in Supabase.</p>'; return; }
  const total = Number(rec.data?.grand_total) || 0, paid = r2(data.reduce((s, p) => s + Number(p.amount), 0)), bal = r2(total - paid);
  const st = payState(total, paid, rec.data?.due_date);
  const canAdd = CAN_EDIT, canDel = CAN_DELETE;
  box.innerHTML = `<h3>Payments <span class="res ${st}" style="margin-left:6px">${PAY_LABEL[st]}</span></h3>
    <div class="paybox"><div><b>${money(total)}</b><span>Invoice total (SAR)</span></div><div><b>${money(paid)}</b><span>Received</span></div>
      <div><b style="color:${bal > 0.005 ? 'var(--red)' : 'var(--green)'}">${money(Math.max(0, bal))}</b><span>Balance</span></div>
      <div><b>${esc(fmtDate(rec.data?.due_date) || '-')}</b><span>Due date</span></div></div>
    ${data.length ? `<div class="table-wrap" style="box-shadow:none;border:1px solid var(--border)"><table><thead><tr><th>Date</th><th style="text-align:right">Amount (SAR)</th><th>Method</th><th>Reference</th><th>Recorded by</th><th></th></tr></thead><tbody>
      ${(await Promise.all(data.map(async p => `<tr><td>${esc(fmtDate(p.paid_on))}</td><td class="money">${money(p.amount)}</td><td>${esc(p.method)}</td><td>${esc(p.reference)}</td>
        <td>${esc(await nameOf(p.created_by))}</td><td>${canDel ? `<button type="button" class="btn small danger" data-delpay="${p.id}">Delete</button>` : ''}</td></tr>`))).join('')}
      </tbody></table></div>` : '<p class="muted" style="margin:0">No payments recorded yet.</p>'}
    ${canAdd && bal > 0.005 ? `<div class="payform">
      <div class="field"><label for="p_date">Payment date</label><input id="p_date" type="date" value="${today()}"></div>
      <div class="field"><label for="p_amt">Amount (SAR)</label><input id="p_amt" type="number" step="0.01" min="0.01" value="${bal.toFixed(2)}"></div>
      <div class="field"><label for="p_method">Method</label><select id="p_method"><option>Bank transfer</option><option>Cash</option><option>Cheque</option><option>Card</option></select></div>
      <div class="field"><label for="p_ref">Reference</label><input id="p_ref" placeholder="Transfer / cheque no."></div>
      <button type="button" class="btn" id="p_add">Record payment</button></div>` : ''}`;
  $('#p_add')?.addEventListener('click', async e => {
    const amt = Number($('#p_amt').value);
    if (!(amt > 0)) { toast('Please enter the amount.', true); return; }
    if (amt > bal + 0.005 && !confirm(`This is more than the balance (${money(bal)}). Record it anyway?`)) return;
    e.target.disabled = true;
    const {error: err} = await sb.from('docs_payments').insert({document_id: rec.id, paid_on: $('#p_date').value || today(), amount: r2(amt),
      method: $('#p_method').value, reference: $('#p_ref').value.trim() || null});
    if (err) { e.target.disabled = false; toast(nice(err), true); return; }
    ILIST.invoice = null; toast('Payment recorded'); drawPayments(rec);
  });
  box.querySelectorAll('[data-delpay]').forEach(b => b.addEventListener('click', async () => {
    if (!confirm('Delete this payment?')) return;
    const {error: err} = await sb.from('docs_payments').delete().eq('id', b.dataset.delpay);
    if (err) { toast(nice(err), true); return; }
    ILIST.invoice = null; toast('Payment deleted'); drawPayments(rec);
  }));
}

/* receivables: what each customer still owes, by how late it is */
async function showReceivables() {
  const seq = ROUTE_SEQ;
  view.innerHTML = '<div class="ah-skel" role="status" aria-label="Loading"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>';
  let list; try { list = await loadIList('invoice', true); } catch (e) { view.innerHTML = `<p class="flash">Database error: ${esc(nice(e))}</p>`; return; }
  if (seq !== ROUTE_SEQ) return;
  const t = today(), days = d => Math.floor((new Date(t) - new Date(d)) / 864e5);
  const B = ['Not due', '1-30 days', '31-60 days', '61-90 days', '90+ days'];
  const by = {};
  list.forEach(r => {
    if (r.paid == null) return;
    const bal = r2((r.data?.grand_total || 0) - r.paid); if (bal <= 0.005) return;
    const due = r.data?.due_date || r.doc_date, late = days(due);
    const b = late <= 0 ? 0 : late <= 30 ? 1 : late <= 60 ? 2 : late <= 90 ? 3 : 4;
    const c = by[r.party_name || '-'] ||= {name: r.party_name || '-', b: [0, 0, 0, 0, 0], n: 0};
    c.b[b] = r2(c.b[b] + bal); c.n++;
  });
  const rows = Object.values(by).map(c => ({...c, total: r2(c.b.reduce((a, x) => a + x, 0))})).sort((a, b) => b.total - a.total);
  const tot = B.map((_, i) => r2(rows.reduce((a, c) => a + c.b[i], 0))), grand = r2(tot.reduce((a, x) => a + x, 0));
  view.innerHTML = `
    <div class="tools"><a class="btn sec" href="#invoice">&larr; Invoices</a><span style="flex:1"></span>
      ${rows.length ? '<button class="btn sec" id="csv">Excel (CSV) download</button>' : ''}</div>
    <div class="kpis" style="margin-bottom:16px">${[['Total receivable', grand, 'var(--teal)'], ['Not due yet', tot[0], 'var(--green)'], ['Overdue', r2(grand - tot[0]), 'var(--red)'], ['90+ days', tot[4], 'var(--orange)']]
      .map(([l, v, c]) => `<div class="kpi"><span><b style="color:${c}">SAR ${money(v)}</b><span>${l}</span></span></div>`).join('')}</div>
    ${list.length && list[0].paid == null ? '<p class="flash">Payments table not found. Run the latest <b>supabase_docs.sql</b> in Supabase.</p>' : ''}
    <div class="table-wrap"><table><thead><tr><th>Customer</th><th style="text-align:right">Invoices</th>${B.map(b => `<th style="text-align:right">${b}</th>`).join('')}<th style="text-align:right">Total (SAR)</th></tr></thead>
    <tbody>${rows.length ? rows.map(c => `<tr><td>${who(c.name)}</td><td class="money">${c.n}</td>${c.b.map((v, i) => `<td class="money"${i >= 3 && v ? ' style="color:var(--red);font-weight:600"' : ''}>${v ? money(v) : '-'}</td>`).join('')}<td class="money"><b>${money(c.total)}</b></td></tr>`).join('')
      : `<tr><td colspan="8" class="empty">No outstanding balances.</td></tr>`}</tbody>
    ${rows.length ? `<tfoot><tr><td><b>Total</b></td><td></td>${tot.map(v => `<td class="money"><b>${money(v)}</b></td>`).join('')}<td class="money"><b>${money(grand)}</b></td></tr></tfoot>` : ''}</table></div>
    <p class="muted" style="font-size:13px">Days are counted from the due date (or from the invoice date if there is no due date).</p>`;
  $('#csv')?.addEventListener('click', () => {
    const q = v => `"${String(v).replace(/"/g, '""')}"`;
    const lines = [['Customer', 'Invoices', ...B, 'Total'], ...rows.map(c => [c.name, c.n, ...c.b, c.total]), ['Total', '', ...tot, grand]].map(r => r.map(q).join(','));
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(['﻿' + lines.join('\n')], {type: 'text/csv'}));
    a.download = `receivables-${today()}.csv`; a.click();
  });
}

/* ============================== PRICE LIST (Category > Sub-category > Product) ============================== */
const CATALOG_TYPES = ['quotation', 'invoice'];
let CATALOG = null;
async function loadCatalog(force) {
  if (CATALOG && !force) return CATALOG;
  const {data, error} = await sb.from('docs_catalog').select('*').order('category').order('subcategory').order('name');
  if (error) throw error;
  data.sort((a, b) => (a.category + '\u0000' + a.subcategory + '\u0000' + a.name).localeCompare(b.category + '\u0000' + b.subcategory + '\u0000' + b.name));
  return CATALOG = data;
}
const uniq = a => [...new Set(a.filter(Boolean))];

async function wirePicker(items, redraw) {
  const box = $('#picker'); if (!box) return;
  let list;
  try { list = (await loadCatalog()).filter(c => c.active); } catch (e) { box.innerHTML = '<b>Price list not found. Run the latest supabase_docs.sql in Supabase.</b>'; return; }
  if (!list.length) { box.innerHTML = `<b>The price list is empty.</b><span class="muted" style="font-size:13px">Open the <a href="#catalog">Price List</a> to add products.</span>`; return; }
  box.innerHTML = `<b>Choose a product from the price list</b>
    <div class="field"><label for="pk_cat">Category</label><select id="pk_cat"><option value="">Choose…</option>${uniq(list.map(c => c.category)).map(c => `<option>${esc(c)}</option>`).join('')}</select></div>
    <div class="field"><label for="pk_sub">Sub-category</label><select id="pk_sub" disabled></select></div>
    <div class="field"><label for="pk_prod">Product</label><select id="pk_prod" disabled></select></div>
    <div class="field" style="flex:0 1 90px"><label for="pk_qty">Qty</label><input id="pk_qty" type="number" min="0" step="any" value="1"></div>
    <button type="button" class="btn" id="pk_add" disabled>+ Add</button>`;
  const cat = $('#pk_cat'), sub = $('#pk_sub'), prod = $('#pk_prod'), add = $('#pk_add');
  const fillProd = () => {
    const ps = list.filter(c => c.category === cat.value && c.subcategory === sub.value);
    prod.innerHTML = ps.map(c => `<option value="${c.id}">${esc(c.name)} — SAR ${money(c.rate)}${c.unit ? ' / ' + esc(c.unit) : ''}</option>`).join('');
    prod.disabled = !ps.length; add.disabled = !ps.length;
  };
  cat.onchange = () => {
    const subs = uniq(list.filter(c => c.category === cat.value).map(c => c.subcategory));
    const hasBlank = list.some(c => c.category === cat.value && !c.subcategory);
    sub.innerHTML = (hasBlank ? '<option value="">(General)</option>' : '') + subs.map(x => `<option>${esc(x)}</option>`).join('');
    sub.disabled = !cat.value; fillProd();
  };
  sub.onchange = fillProd;
  add.onclick = () => {
    const c = list.find(x => x.id === prod.value); if (!c) return;
    const it = {description: c.name + (c.description ? '\n' + c.description : '') + (c.unit ? ` (per ${c.unit})` : ''), qty: $('#pk_qty').value || '1', rate: String(c.rate), tax_pct: '15'};
    const blank = items.length === 1 && !items[0].description && !items[0].qty && !items[0].rate;
    if (blank) items[0] = it; else items.push(it);
    redraw(); toast(`${c.name} added`);
  };
}

async function showCatalog() {
  const seq = ROUTE_SEQ;
  view.innerHTML = '<div class="ah-skel" role="status" aria-label="Loading"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>';
  let list; try { list = await loadCatalog(true); } catch (e) { view.innerHTML = `<p class="flash">Price list not found: ${esc(nice(e))}. Run the latest <b>supabase_docs.sql</b> in Supabase.</p>`; return; }
  if (seq !== ROUTE_SEQ) return;
  view.innerHTML = `
    <div class="tools">
      <div class="field"><label for="q">Search</label><input id="q" type="search" placeholder="Product, category…"></div>
      <div class="field"><label for="fc">Category</label><select id="fc" data-remember="docs.catalog.cat"><option value="">All</option>${uniq(list.map(c => c.category)).map(c => `<option>${esc(c)}</option>`).join('')}</select></div>
      <span style="flex:1"></span>${CAN_EDIT ? '<button class="btn" id="addc">+ Add product</button>' : ''}</div>
    <div id="cform"></div>
    <div class="table-wrap"><table><thead><tr><th>Product</th><th>Description</th><th>Unit</th><th style="text-align:right">Rate (SAR)</th><th></th></tr></thead><tbody id="rows"></tbody></table></div>
    <p class="muted" style="font-size:13px">These products can be added to Quotation and Invoice "Items" by choosing Category, then Sub-category, then Product; the details fill in automatically.</p>`;
  const draw = () => {
    const q = $('#q').value.trim().toLowerCase(), fc = $('#fc').value;
    const rows = list.filter(c => (!fc || c.category === fc) && (!q || [c.category, c.subcategory, c.name, c.description].join(' ').toLowerCase().includes(q)));
    let lastC = null, lastS = null, html = '';
    rows.forEach(c => {
      if (c.category !== lastC) { html += `<tr class="cathead"><td colspan="5">${esc(c.category)}</td></tr>`; lastC = c.category; lastS = null; }
      if (c.subcategory !== lastS) { if (c.subcategory) html += `<tr class="catsub"><td colspan="5">${esc(c.subcategory)}</td></tr>`; lastS = c.subcategory; }
      html += `<tr class="${CAN_EDIT ? 'click' : ''} ${c.active ? '' : 'inactive'}" data-id="${c.id}"><td style="padding-left:${c.subcategory ? 40 : 28}px"><b>${esc(c.name)}</b>${c.active ? '' : ' <span class="res draft">Hidden</span>'}</td>
        <td class="muted">${esc(c.description)}</td><td>${esc(c.unit)}</td><td class="money">${money(c.rate)}</td><td>${CAN_EDIT ? '<button class="btn small sec">Edit</button>' : ''}</td></tr>`;
    });
    $('#rows').innerHTML = html || `<tr><td colspan="5" class="empty">${list.length ? 'Nothing found.' : 'The price list is empty.' + (CAN_EDIT ? ' Click "+ Add product" to start.' : '')}</td></tr>`;
  };
  const form = c => {
    const isNew = !c; c = c || {active: true, category: $('#fc').value};
    $('#cform').innerHTML = `<div class="sheet"><h3>${isNew ? 'Add product' : 'Edit product'}</h3><div class="grid">
      <div class="field"><label for="c_cat">Category</label><input id="c_cat" list="cats" required value="${esc(c.category)}" placeholder="e.g. Tanks"><datalist id="cats">${uniq(list.map(x => x.category)).map(x => `<option value="${esc(x)}">`).join('')}</datalist></div>
      <div class="field"><label for="c_sub">Sub-category</label><input id="c_sub" list="subs" value="${esc(c.subcategory)}" placeholder="e.g. Diesel tanks"><datalist id="subs">${uniq(list.map(x => x.subcategory)).map(x => `<option value="${esc(x)}">`).join('')}</datalist></div>
      <div class="field"><label for="c_name">Product</label><input id="c_name" required value="${esc(c.name)}" placeholder="e.g. Diesel tank 30,000 L"></div>
      <div class="field"><label for="c_unit">Unit</label><input id="c_unit" value="${esc(c.unit)}" placeholder="pcs, set, job, m"></div>
      <div class="field"><label for="c_rate">Rate (SAR, without VAT)</label><input id="c_rate" type="number" min="0" step="0.01" value="${esc(c.rate ?? '')}"></div>
      <div class="field"><label><input type="checkbox" id="c_act"${c.active ? ' checked' : ''} style="width:auto"> Show in quotations</label></div></div>
      <div class="field"><label for="c_desc">Description (shown under the product on quotations)</label><textarea id="c_desc" rows="2">${esc(c.description)}</textarea></div>
      <div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn" id="c_save">Save product</button><button class="btn sec" id="c_cancel">Cancel</button>
        <span style="flex:1"></span>${!isNew && CAN_DELETE ? '<button class="btn danger" id="c_del">Delete</button>' : ''}</div><p class="err" id="c_err"></p></div>`;
    $('#c_cat').focus();
    $('#c_cancel').onclick = () => $('#cform').innerHTML = '';
    $('#c_save').onclick = async e => {
      const row = {category: $('#c_cat').value.trim(), subcategory: $('#c_sub').value.trim(), name: $('#c_name').value.trim(), unit: $('#c_unit').value.trim() || null,
                   rate: Number($('#c_rate').value || 0), description: $('#c_desc').value.trim() || null, active: $('#c_act').checked};
      if (!row.category || !row.name) { $('#c_err').textContent = 'Category and product name are required.'; return; }
      e.target.disabled = true;
      const res = isNew ? await sb.from('docs_catalog').insert(row) : await sb.from('docs_catalog').update({...row, updated_at: new Date().toISOString()}).eq('id', c.id);
      if (res.error) { e.target.disabled = false; $('#c_err').textContent = nice(res.error); return; }
      toast(isNew ? 'Product added' : 'Product updated'); CATALOG = null; route();
    };
    $('#c_del')?.addEventListener('click', async () => {
      if (!confirm(`Delete ${c.name} from the price list? (Existing quotations will not be affected.)`)) return;
      const {error} = await sb.from('docs_catalog').delete().eq('id', c.id);
      if (error) { $('#c_err').textContent = nice(error); return; }
      toast('Product deleted'); CATALOG = null; route();
    });
  };
  $('#q').addEventListener('input', draw); $('#fc').addEventListener('change', draw);
  $('#addc')?.addEventListener('click', () => form(null));
  $('#rows').addEventListener('click', e => { const tr = e.target.closest('tr[data-id]'); if (tr && CAN_EDIT) { form(list.find(c => c.id === tr.dataset.id)); $('#cform').scrollIntoView({behavior: 'smooth', block: 'start'}); } });
  draw();
}

/* ============================== routing ============================== */
let ROUTE_SEQ = 0;
/* Save & New: after saving, open a fresh form of the same type */
let SAVE_NEW = false;
document.addEventListener('click', e => {
  if (e.target.closest('#save')) SAVE_NEW = false;
  if (e.target.closest('#saveNew')) { SAVE_NEW = true; $('#f')?.requestSubmit(); }
});
function goAfterSave(type, id) {
  const to = SAVE_NEW ? `#${type}/new` : `#${type}/${id}`; SAVE_NEW = false;
  if (location.hash !== to) location.hash = to; else route();
}
async function route() {
  ROUTE_SEQ++;
  const h = location.hash.replace(/^#/, '') || 'leak';
  const [type, a, b] = h.split('/');
  if (!['leak', 'tank', 'quotation', 'invoice', 'dn', 'po', 'jobcard', 'mr', 'receipt', 'catalog'].includes(type)) { location.hash = '#leak'; return; }
  $$('#tabs a').forEach(x => x.classList.toggle('on', x.dataset.t === type));
  if (type === 'catalog') return showCatalog();
  if (type !== 'leak') {
    const form = type === 'tank' ? (i, c) => showTankForm(i, c) : type === 'receipt' ? (i, c) => showReceiptForm(i, c) : (i, c) => showIForm(type, i, c);
    if (!a) return showIList(type);
    if (a === 'new') return CAN_EDIT ? form(null) : (location.hash = '#' + type);
    if (a === 'copy') return CAN_EDIT ? form(null, b) : (location.hash = '#' + type);
    if (a === 'receivables' && type === 'invoice') return showReceivables();
    if (a === 'fromquote' && type === 'invoice') return CAN_EDIT ? showIForm('invoice', null, null, b) : (location.hash = '#invoice');
    return form(a);
  }
  if (!a) return showList();
  if (a === 'new') return CAN_EDIT ? showForm(null) : (location.hash = '#leak');
  if (a === 'copy') return CAN_EDIT ? showForm(null, b) : (location.hash = '#leak');
  return showForm(a);
}
let lastHash = location.hash, goingBack = false;
window.addEventListener('hashchange', () => {
  if (goingBack) { goingBack = false; return; }
  if (dirty && !confirm('Your changes are not saved. Leave anyway?')) {
    goingBack = true; location.hash = lastHash; return;
  }
  dirty = false; lastHash = location.hash; route();
});
route();
})();
</script>
