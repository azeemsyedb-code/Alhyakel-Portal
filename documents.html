<script src="assets/config.js"></script>
<script src="assets/portal.js" data-module="docs"></script>
<style>
.ahhead .row{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:end;margin-bottom:14px}
.tools .field{margin:0}
.tools input[type=search]{width:min(340px,100%)}
td .btn{margin-right:4px}
td.no{font-weight:600;color:var(--text);white-space:nowrap}
.res{display:inline-block;font-size:11.5px;font-weight:600;padding:3px 10px;border-radius:99px;white-space:nowrap}
.res.PASS{background:#E5F5EC;color:#23794F}
.res.FAIL{background:#FCE8EB;color:#B4283D}
.res.draft{background:#FFF1E6;color:#B5591A}
.res.paid{background:#E5F5EC;color:#23794F}.res.partial{background:#E6EEF8;color:#2B66A6}.res.unpaid{background:#EEF1F3;color:#5E6E76}.res.overdue{background:#FCE8EB;color:#B4283D}
.status-line{margin:2px 0 14px;font-size:14px}
.empty{padding:34px 18px;text-align:center;color:var(--muted)}
tbody tr.click{cursor:pointer}
tbody tr.click:hover td{background:#F7FAFB}
.who{display:flex;align-items:center;gap:10px}
.mini{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:600;font-size:11.5px}

/* form */
.sheet{background:#fff;border-radius:12px;padding:6px 22px 20px;margin-bottom:16px;box-shadow:0 2px 10px rgba(30,60,80,.06)}
.sheet h3{color:var(--text);font-size:15px;font-weight:600;margin:18px 0 12px;padding-bottom:8px;border-bottom:1px solid var(--border)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:2px 18px}
.field input,.field select,.field textarea{width:100%}
textarea{resize:vertical;min-height:70px}
.fixed{padding:9px 11px;background:#F2F8F9;border:1px dashed #CFE2E6;border-radius:8px;font-weight:600;color:var(--teal-dark)}
.choice{display:flex;gap:18px;flex-wrap:wrap;padding:6px 0}
.choice label{display:flex;align-items:center;gap:7px;font-weight:500;cursor:pointer}
.choice input{width:18px;height:18px;margin:0;accent-color:var(--teal)}
.choice.result label{padding:7px 16px;border:1.5px solid var(--border);border-radius:99px}
.choice.result label:has(input:checked)[data-v=PASS]{border-color:var(--green);color:#23794F;background:#E5F5EC}
.choice.result label:has(input:checked)[data-v=FAIL]{border-color:var(--red);color:#B4283D;background:#FCE8EB}
.hint{font-size:12.5px;color:var(--muted);margin:2px 0 0}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.slot{border:1.5px dashed #CFDADF;border-radius:12px;aspect-ratio:4/3;position:relative;display:grid;place-items:center;background:#FAFCFC;overflow:hidden}
.slot img{width:100%;height:100%;object-fit:contain;background:#fff}
.slot .lbl{color:var(--muted);font-size:14px;text-align:center;padding:10px}
.slot input{position:absolute;inset:0;opacity:0;cursor:pointer}
.slot .x{position:absolute;top:8px;right:8px;background:#fff;border:1px solid var(--border);border-radius:99px;padding:3px 10px;font:500 12px var(--font);cursor:pointer;z-index:2}
.slot.qr{aspect-ratio:1;max-width:220px}
.slot.filled{border-style:solid;border-color:var(--border)}
.slot.ro input{display:none}
.bar{position:sticky;bottom:0;background:rgba(245,247,249,.94);backdrop-filter:blur(6px);border-top:1px solid var(--border);padding:12px 0;display:flex;gap:10px;flex-wrap:wrap;align-items:center;z-index:5}
.bar .grow{flex:1}
.meta{font-size:13px;color:var(--muted);margin:2px 0 0}
.err{margin:0}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--text);color:#fff;padding:11px 18px;border-radius:10px;font-weight:500;z-index:60;box-shadow:0 10px 30px rgba(0,0,0,.2)}
#toast.bad{background:var(--red)}
.busy{opacity:.6;pointer-events:none}
/* line items */

<body>
<div class="ahhead">
  <div class="row"><div><h1>Documents</h1><p>Certificates and company documents: save, approve, download PDFs and share.</p></div><span class="pill" id="myRole"></span></div>
  <nav class="ahpills" id="tabs" aria-label="Document types">
    <a href="#leak" data-t="leak">Leak Test</a>
    <a href="#tank" data-t="tank">Tank Certificate</a>
    <a href="#quotation" data-t="quotation">Quotation</a>
    <a href="#invoice" data-t="invoice">Invoice</a>
    <a href="#dn" data-t="dn">Delivery Note</a>
    <a href="#po" data-t="po">Purchase Order</a>
    <a href="#jobcard" data-t="jobcard">Job Card</a>
    <a href="#mr" data-t="mr">Material Request</a>
    <a href="#receipt" data-t="receipt">Cash Receipt</a>
    <a href="#catalog" data-t="catalog">Price List</a>
  </nav>
</div>
<main>
  <div id="view"></div>
</main>
<div id="toast" hidden></div>

<script>
(async () => {
/* ============================== setup ============================== */
const U = await window.PORTAL_READY;
const sb = window.portalSb;
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
const view = $('#view');
const ROLE = U.docs_role;                       // manager | staff | viewer
const CAN_EDIT = ROLE === 'manager' || ROLE === 'staff';
const CAN_DELETE = ROLE === 'manager';
$('#myRole').textContent = ROLE;
const BUCKET = 'docs';
const today = () => new Intl.DateTimeFormat('en-CA', {timeZone: 'Asia/Riyadh'}).format(new Date());
const fmtDate = d => d ? new Date(d + 'T00:00:00').toLocaleDateString('en-GB', {day: '2-digit', month: 'short', year: 'numeric'}) : '';

/* Leak test: fixed standards (saved inside each certificate, so old ones never change) */
const LEAK = {
  pressure: '0.30 Bar / 4.2 PSI',
  prv: '0.60 Bar / 8.5 PSI',
  medium: {pneumatic: 'Dry Air + Soap Solution', hydrostatic: 'Water'},
  duration: '15 Minutes',
  equipment: 'Air Compressor with Regulator',
  criteria: '1. No visible leaks on welds, fittings\n2. Pressure drop < 0.05 Bar in required duration\n3. No permanent deformation',
  statement: result => result === 'FAIL'
    ? 'Leakage was found during the test. This tank trailer is not fit for service until it is repaired and re-tested.'
    : 'This tank trailer has been leak tested and found free from leaks. Certified fit for service.',
  isAuto: t => !t || t === LEAK.statement('PASS') || t === LEAK.statement('FAIL') || /^The (pneumatic|hydrostatic) leak test was carried out/.test(t)
};

let toastT;
function toast(msg, bad) {
  const t = $('#toast'); t.textContent = msg; t.className = bad ? 'bad' : ''; t.hidden = false;
  clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, bad ? 6000 : 3000);
}
const nice = e => (e && (e.message || e.error_description)) || String(e);

/* ============================== data ============================== */
let LIST = null;   // leak certificates (latest first)
async function loadList(force) {
  if (LIST && !force) return LIST;
  const {data, error} = await sb.from('docs_documents')
    .select('id, doc_no, doc_date, party_name, data, files, status, created_at, updated_at')
    .eq('doc_type', 'leak').order('created_at', {ascending: false}).limit(5000);
  if (error) throw error;
  LIST = data;
  return LIST;
}
const nameOf = (() => { let cache = null;
  return async id => {
    if (!id) return '';
    if (!cache) { const {data} = await sb.from('portal_users').select('id, full_name, username'); cache = Object.fromEntries((data || []).map(u => [u.id, u.full_name || u.username])); }
    return cache[id] || '';
  };
})();
function nextProjectNo() {
  const n = Math.max(0, ...(LIST || []).map(r => parseInt(r.data?.project_no, 10)).filter(Number.isFinite));
  return String(n + 1).padStart(2, '0');
}

/* ============================== images ============================== */
const blobToDataUrl = b => new Promise((ok, no) => { const r = new FileReader(); r.onload = () => ok(r.result); r.onerror = no; r.readAsDataURL(b); });
const loadImg = src => new Promise((ok, no) => { const i = new Image(); i.onload = () => ok(i); i.onerror = () => no(new Error('Could not load image')); i.src = src; });
async function shrink(file, max, type, quality) {
  const img = await loadImg(URL.createObjectURL(file));
  const k = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
  const c = document.createElement('canvas');
  c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
  const g = c.getContext('2d');
  if (type === 'image/jpeg') { g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); }
  g.drawImage(img, 0, 0, c.width, c.height);
  URL.revokeObjectURL(img.src);
  const blob = await new Promise(r => c.toBlob(r, type, quality));
  return {blob, dataUrl: await blobToDataUrl(blob), w: c.width, h: c.height};
}
async function fileFromStorage(path) {
  const {data, error} = await sb.storage.from(BUCKET).download(path);
  if (error) throw error;
  const dataUrl = await blobToDataUrl(data);
  const img = await loadImg(dataUrl);
  return {dataUrl, w: img.naturalWidth, h: img.naturalHeight};
}
let ASSETS = null;
async function assets() {
  if (ASSETS) return ASSETS;
  const get = async p => { const r = await fetch(p); if (!r.ok) throw new Error(p + ' not found'); const d = await blobToDataUrl(await r.blob()); const i = await loadImg(d); return {dataUrl: d, w: i.naturalWidth, h: i.naturalHeight}; };
  const [header, footer, stamp] = await Promise.all(['assets/header.jpg', 'assets/footer.jpg', 'assets/stamp.png'].map(get));
  return ASSETS = {header, footer, stamp};
}

/* ============================== PDF ============================== */
const C = {slate: [46, 88, 104], orange: [221, 107, 42], ink: [28, 36, 40], muted: [110, 122, 128], line: [176, 190, 195], shade: [236, 242, 243], green: [45, 122, 76], red: [179, 38, 30]};

/* Leak Test certificate — layout copied from the company's reference certificate (TS-2609001):
   full-width letterhead, title bar, 4 numbered sections, result box; page 2 = 4 photos + stamp + QR. */
function coverCrop(p, aspect) {            // crop a photo to fill a box (like CSS object-fit: cover)
  const c = document.createElement('canvas'), ratio = p.w / p.h;
  let sw = p.w, sh = p.h; if (ratio > aspect) sw = p.h * aspect; else sh = p.w / aspect;
  const K = Math.min(1, 1400 / Math.max(sw, sh)); c.width = Math.round(sw * K); c.height = Math.round(sh * K);
  const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height);
  g.drawImage(p.el, (p.w - sw) / 2, (p.h - sh) / 2, sw, sh, 0, 0, c.width, c.height);
  return c.toDataURL('image/jpeg', 0.82);
}
const LK = {bar: [44, 86, 102], sec: [62, 118, 135], lbl: [248, 250, 252], line: [218, 221, 228], lt: [84, 100, 112], ink: [33, 37, 41],
  passF: [232, 245, 236], passB: [29, 122, 75], failF: [252, 235, 233], failB: [179, 38, 30], card: [225, 228, 232]};
const dmy = d => d ? d.split('-').reverse().join('/') : '';
// up to 4 photos in a 2 x 2 grid of cards (photos fill each card, like CSS object-fit: cover)
function drawPhotoGrid(pdf, list, x0, y0, w, h) {
  const photos = (list || []).filter(Boolean).slice(0, 4), G = 3.2, IN = 2.1, cw = (w - G) / 2, chh = (h - G) / 2;
  photos.forEach((p, i) => {
    const x = x0 + (i % 2) * (cw + G), yy = y0 + Math.floor(i / 2) * (chh + G);
    pdf.setDrawColor(...LK.card); pdf.setLineWidth(0.3); pdf.roundedRect(x, yy, cw, chh, 1, 1, 'S');
    const iw = cw - 2 * IN, ih = chh - 2 * IN;
    try { pdf.addImage(p.el ? coverCrop(p, iw / ih) : p.dataUrl, 'JPEG', x + IN, yy + IN, iw, ih, 'ph' + i + '_' + Math.round(y0)); } catch (e) {}
  });
  return photos.length;
}
const withEl = photos => Promise.all((photos || []).map(async p => p ? {...p, el: p.el || await loadImg(p.dataUrl).catch(() => null)} : null));
function leakPdf(r, img) {
  const {jsPDF} = window.jspdf;
  const pdf = new jsPDF({unit: 'mm', format: 'a4', compress: true});
  const W = 210, H = 297, X0 = 0.4, X1 = 209.6;
  const d = r.data || {};
  const frame = () => {
    pdf.addImage(img.header.dataUrl, 'JPEG', 0, 4.2, W, W * img.header.h / img.header.w, 'hdr');
    const fh = W * img.footer.h / img.footer.w; pdf.addImage(img.footer.dataUrl, 'JPEG', 0, H - fh, W, fh, 'ftr');
  };
  const text1 = (t, x, y, w, {size = 9, style = 'normal', font = 'helvetica', color = LK.ink, align = 'left'} = {}) => {
    pdf.setFont(font, style); pdf.setTextColor(...color); let s = size; pdf.setFontSize(s);
    while (s > 6.5 && pdf.getTextWidth(t) > w) { s -= 0.5; pdf.setFontSize(s); }
    pdf.text(t, align === 'right' ? x + w : x, y, {baseline: 'middle', align});
  };
  const band = (t, y) => { pdf.setFillColor(...LK.sec); pdf.rect(X0, y, X1 - X0, 7.6, 'F');
    pdf.setFont('helvetica', 'bold'); pdf.setFontSize(9); pdf.setTextColor(255, 255, 255); pdf.text(t, 3.7, y + 3.9, {baseline: 'middle'}); return y + 7.6; };
  const box = (x, y, w, h, fill) => { pdf.setDrawColor(...LK.line); pdf.setLineWidth(0.35);
    if (fill) { pdf.setFillColor(...fill); pdf.rect(x, y, w, h, 'FD'); } else pdf.rect(x, y, w, h, 'S'); };
  const label = (t, x, y, w, h, top) => { box(x, y, w, h, LK.lbl); text1(t, x + 3.5, top ? y + 4.6 : y + h / 2, w - 5, {color: LK.lt, size: 9}); };
  const value = (v, x, y, w, h, {mono = false, draw} = {}) => {
    box(x, y, w, h);
    if (draw) return draw(x, y, w, h);
    v = String(v ?? '').trim(); if (!v) return;
    if (hasAr(v)) { const a = arImg(v, 9.5, {maxW: w - 6, color: '#212529'}); const k = Math.min(1, (h - 1.5) / a.h, (w - 6) / a.w);
      const rtl = !/^[^؀-ۿA-Za-z]*[A-Za-z]/.test(v);
      pdf.addImage(a.dataUrl, 'PNG', rtl ? x + w - 3.5 - a.w * k : x + 3, y + (h - a.h * k) / 2, a.w * k, a.h * k); return; }
    text1(v, x + 3.5, y + h / 2, w - 6, mono ? {font: 'courier', style: 'bold', size: 9.8} : {});
  };
  // one row: [label, value, opts] pairs laid out on the section's column stops
  const row = (y, h, stops, cells) => {
    const xs = [X0, ...stops, X1];
    if (cells.length === 1) { const [l, v, o] = cells[0]; label(l, xs[0], y, xs[1] - xs[0], h, o?.top); value(v, xs[1], y, X1 - xs[1], h, o); return y + h; }
    cells.forEach(([l, v, o], i) => { label(l, xs[2 * i], y, xs[2 * i + 1] - xs[2 * i], h, o?.top); value(v, xs[2 * i + 1], y, xs[2 * i + 2] - xs[2 * i + 1], h, o); });
    return y + h;
  };
  const check = (x, cy, on, t) => {
    pdf.setDrawColor(...LK.ink); pdf.setLineWidth(0.25); pdf.rect(x, cy - 1.45, 2.9, 2.9, 'S');
    if (on) { pdf.setLineWidth(0.45); pdf.line(x + 0.55, cy, x + 1.25, cy + 0.85); pdf.line(x + 1.25, cy + 0.85, x + 2.4, cy - 0.95); }
    pdf.setFont('helvetica', 'normal'); pdf.setFontSize(9); pdf.setTextColor(...LK.ink); pdf.text(t, x + 4.3, cy, {baseline: 'middle'});
    return x + 4.3 + pdf.getTextWidth(t) + 4.5;
  };

  /* ---------------- page 1 ---------------- */
  frame();
  pdf.setFillColor(...LK.bar); pdf.rect(X0, 48.2, X1 - X0, 13.4, 'F');
  pdf.setFont('helvetica', 'bold'); pdf.setFontSize(15); pdf.setTextColor(255, 255, 255);
  pdf.text('LEAK TEST INSPECTION CERTIFICATE', W / 2, 55.4, {align: 'center', baseline: 'middle'});
  const RH = 8.8, GAP = 9;
  let y = band('1. GENERAL INFORMATION', 70.4);
  y = row(y, RH, [54.7, 116.5, 170.8], [['Test Number:', r.doc_no || 'DRAFT', {mono: true}], ['Project No:', d.project_no, {mono: true}]]);
  y = row(y, RH, [54.7], [['Customer Name:', r.party_name]]);
  y = band('2. TANK & SPECIFICATION DETAILS', y + GAP);
  y = row(y, RH, [54.7, 98.5, 153], [['Capacity:', d.capacity], ['Material & Thickness:', d.material]]);
  y = row(y, RH, [54.7, 98.5, 153], [['Trailer Chassis No:', d.chassis_no, {mono: true}], ['Tank Serial No:', d.tank_serial, {mono: true}]]);
  y = band('3. TEST PARAMETERS & EQUIPMENT', y + GAP);
  const S3 = [54.7, 109.4, 163.6];
  y = row(y, RH, S3, [['Test Method:', '', {draw: (x, yy, w, h) => { const m = d.test_method === 'hydrostatic' ? 'hydrostatic' : 'pneumatic';
      const nx = check(x + 3.5, yy + h / 2, m === 'pneumatic', 'Pneumatic'); check(nx, yy + h / 2, m === 'hydrostatic', 'Hydrostatic'); }}], ['Test Medium:', d.test_medium]]);
  y = row(y, RH, S3, [['Required Test Pressure:', d.test_pressure || LEAK.pressure], ['Safety Settings (PRV):', d.prv || LEAK.prv]]);
  const time = d.time_from || d.time_to ? ` (${[d.time_from, d.time_to].filter(Boolean).join(' - ')})` : '';
  y = row(y, RH, S3, [['Test Date & Time:', dmy(r.doc_date) + time], ['Required Duration:', d.test_duration]]);
  y = row(y, RH, S3, [['Test Equipment:', d.test_equipment]]);
  y = band('4. ACCEPTANCE CRITERIA & REMARKS', y + GAP);
  const para = (v, x, yy, w, max) => { pdf.setFont('helvetica', 'normal'); pdf.setFontSize(9); pdf.setTextColor(...LK.ink);
    const lines = String(v || '').split('\n').flatMap(l => pdf.splitTextToSize(l, w - 7)).slice(0, max); pdf.text(lines, x + 3.5, yy + 4.9, {baseline: 'middle', lineHeightFactor: 1.38}); };
  const crit = String(d.criteria ?? LEAK.criteria).trim(), rem = String(d.remarks || '').trim();
  pdf.setFont('helvetica', 'normal'); pdf.setFontSize(9);
  const nl = (v, w, max) => Math.min(max, String(v).split('\n').flatMap(l => pdf.splitTextToSize(l, w - 7)).length);
  const VW = X1 - 54.7, critN = crit ? nl(crit, VW, 6) : 1, remN = rem ? nl(rem, VW, 4) : 1;
  const hOf = n => n <= 1 ? RH : 4.6 + n * 4.38;
  const ch = hOf(critN), rh = hOf(remN);
  label('Acceptance Criteria:', X0, y, 54.7 - X0, ch, critN > 1); box(54.7, y, VW, ch);
  if (critN > 1) para(crit, 54.7, y, VW, 6); else if (crit) text1(crit, 58.2, y + ch / 2, VW - 6);
  y += ch;
  label('Inspection Remarks:', X0, y, 54.7 - X0, rh, remN > 1); box(54.7, y, VW, rh);
  if (remN > 1) para(rem, 54.7, y, VW, 4); else if (rem && hasAr(rem)) value(rem, 54.7, y, VW, rh); else if (rem) text1(rem, 58.2, y + rh / 2, VW - 6);
  y += rh;
  // result box
  const pass = d.result !== 'FAIL', ry = Math.min(Math.max(y + 14, 237.7), 247), rx = 6.9, rw = 196.2;
  const stmt = String(d.statement || LEAK.statement(d.result)).trim();
  pdf.setFont('helvetica', 'normal'); pdf.setFontSize(9); const sl = pdf.splitTextToSize(stmt, rw - 12).slice(0, 3);
  const rhh = 12.6 + sl.length * 4.2;
  pdf.setFillColor(...(pass ? LK.passF : LK.failF)); pdf.setDrawColor(...(pass ? LK.passB : LK.failB)); pdf.setLineWidth(0.55);
  pdf.roundedRect(rx, ry, rw, rhh, 1.2, 1.2, 'FD');
  pdf.setFont('helvetica', 'bold'); pdf.setFontSize(13); pdf.setTextColor(...(pass ? LK.passB : LK.failB));
  pdf.text(`TEST RESULT: ${pass ? 'PASS' : 'FAIL'}`, W / 2, ry + 6.6, {align: 'center', baseline: 'middle', charSpace: 0.2});
  pdf.setFont('helvetica', 'normal'); pdf.setFontSize(8.6); pdf.setTextColor(...LK.ink);
  pdf.text(sl, W / 2, ry + 12.5, {align: 'center', baseline: 'middle', lineHeightFactor: 1.35});

  /* ---------------- page 2 ---------------- */
  pdf.addPage(); frame();
  drawPhotoGrid(pdf, img.photos, 6.9, 44.8, 196.2, 160.4);
  const SW = 38.1, sk = SW / img.stamp.w, sh = img.stamp.h * sk;
  pdf.addImage(img.stamp.dataUrl, 'PNG', 109.6, 236.6 + (16 - sh) / 2, SW, sh, 'stamp');
  if (img.qrUrl) {
    const Q = 31, qx = 68, qy = 229;
    drawQr(pdf, img.qrUrl, qx, qy, Q);
    pdf.setFont('helvetica', 'normal'); pdf.setFontSize(6.5); pdf.setTextColor(110, 122, 128);
    pdf.text('Scan to verify this certificate', qx + Q / 2, qy + Q + 2.6, {align: 'center'});
  }
  return pdf;
}

async function pdfFor(rec, photos, token) {
  await arabicReady();
  return leakPdf(rec, {...await assets(), photos: await withEl(photos), qrUrl: token ? verifyUrl(token) : null});
}

/* ============================== certificate QR -> public PDF ============================== */
const CERT_BUCKET = 'certs';
const newToken = () => [...crypto.getRandomValues(new Uint8Array(16))].map(b => b.toString(16).padStart(2, '0')).join('');   // 128-bit, unguessable
const certUrl = t => `${String(PORTAL_CONFIG.SUPABASE_URL).replace(/\/+$/, '')}/storage/v1/object/public/${CERT_BUCKET}/${t}.pdf`;
// what the QR code opens: the portal's public "Verified" page for this certificate (it links on to the PDF)
const verifyUrl = t => new URL(`verify.html?c=${t}`, location.href.split('#')[0]).href;
async function uploadCert(token, pdf) {
  const {error} = await sb.storage.from(CERT_BUCKET).upload(`${token}.pdf`, pdf.output('blob'), {contentType: 'application/pdf', upsert: true, cacheControl: '60'});
  if (error) toast('Certificate saved, but the QR PDF could not be uploaded: ' + nice(error) + '. Run the latest supabase_docs.sql in Supabase, then click Save again.', true);
  return !error;
}

/* ============================== small helpers ============================== */
const AV_COLORS = ['#1D6E80', '#E07A2E', '#2E9E6A', '#3B82C4', '#8A5CC2', '#D9475B', '#C27A1A'];
function who(name) {
  const n = String(name || '').trim(); if (!n) return '';
  let h = 0; for (const ch of n) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
  const ini = n.split(/\s+/).filter(w => /\w/.test(w)).slice(0, 2).map(w => w[0]).join('').toUpperCase() || n[0];
  return `<span class="who"><span class="mini" style="background:${AV_COLORS[h % AV_COLORS.length]}">${esc(ini)}</span>${esc(n)}</span>`;
}

/* Share a PDF: phones open the share sheet (WhatsApp, email, …) with the PDF attached;
   computers download the PDF and open WhatsApp Web / the email app with a ready message. */
function wireShare(btn, getPdf, getName, getText) {
  btn.addEventListener('click', async e => {
    e.stopPropagation();
    const old = btn.textContent; btn.disabled = true; btn.textContent = 'Please wait…';
    try {
      const pdf = await getPdf(), name = getName(), text = getText();
      const file = new File([pdf.output('blob')], name, {type: 'application/pdf'});
      if (navigator.canShare && navigator.canShare({files: [file]})) {
        try { await navigator.share({files: [file], title: name, text}); } catch (err) { if (err.name !== 'AbortError') throw err; }
        return;
      }
      document.querySelectorAll('.sharemenu').forEach(m => m.remove());
      const m = document.createElement('div'); m.className = 'sharemenu';
      m.innerHTML = '<button type="button" data-s="wa">WhatsApp</button><button type="button" data-s="mail">Email</button><button type="button" data-s="dl">Download PDF only</button>';
      btn.parentElement.appendChild(m);
      m.addEventListener('click', ev => {
        const k = ev.target.dataset.s; if (!k) return;
        pdf.save(name);
        if (k === 'wa') window.open('https://wa.me/?text=' + encodeURIComponent(text + '\n(PDF attached)'), '_blank', 'noopener');
        if (k === 'mail') location.href = `mailto:?subject=${encodeURIComponent(name.replace(/\.pdf$/, '') + ' - Al Hyakel Metal Industries')}&body=${encodeURIComponent(text + '\n\nPlease find the PDF attached.\n\nRegards,\nAl Hyakel Metal Industries')}`;
        if (k !== 'dl') toast('PDF downloaded. Please attach it to your message.');
        m.remove();
      });
      setTimeout(() => document.addEventListener('click', () => m.remove(), {once: true}), 0);
    } catch (err) { toast('Could not share: ' + nice(err), true); }
    finally { btn.disabled = false; btn.textContent = old; }
  });
}

/* ============================== WhatsApp ==============================
   Certificates send the public "Verified" page (it opens the PDF).
   Delivery notes and job cards: the current PDF is uploaded to the public certs bucket
   under s/<record id>.pdf. The id is a random UUID, so only people with the link can open it. */
const WA_TYPES = {leak: 'Leak Test Certificate', tank: 'Tank Certificate', dn: 'Delivery Note', jobcard: 'Job Card'};
const WA_ICON = '<svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 3 10 14"/><path d="M21 3l-6.5 18-3.5-7-7-3.5z"/></svg>';
const waNum = s => { let d = String(s || '').replace(/\D/g, ''); if (d.startsWith('00')) d = d.slice(2);
  if (/^05\d{8}$/.test(d)) d = '966' + d.slice(1); else if (/^5\d{8}$/.test(d)) d = '966' + d; return d; };
const waMemo = {
  get: p => { try { return JSON.parse(localStorage.getItem('docs.wa.numbers') || '{}')[String(p || '').trim().toLowerCase()] || ''; } catch (e) { return ''; } },
  set: (p, n) => { try { const m = JSON.parse(localStorage.getItem('docs.wa.numbers') || '{}'); m[String(p || '').trim().toLowerCase()] = n; localStorage.setItem('docs.wa.numbers', JSON.stringify(m)); } catch (e) {} }
};
const shareUrl = id => certUrl(`s/${id}`);
async function waLink(type, rec, makePdf) {
  if (type === 'leak' || type === 'tank') {
    const t = rec.files?.qr_token;
    if (!t) throw new Error('This certificate has no QR link yet. Open it and click Save once, then send it.');
    return verifyUrl(t);
  }
  const pdf = await makePdf();
  const {error} = await sb.storage.from(CERT_BUCKET).upload(`s/${rec.id}.pdf`, pdf.output('blob'), {contentType: 'application/pdf', upsert: true, cacheControl: '60'});
  if (error) throw new Error('Could not create the PDF link: ' + nice(error));
  return shareUrl(rec.id);
}
function waText(type, r, link) {
  const d = r.data || {}, hi = '', sign = '\n\nRegards,\nAl Hyakel Metal Industries\n0541857480';
  if (type === 'tank') return hi + `Please find the Tank Trailer Axles Certificate ${r.doc_no}` + (r.party_name ? ` for ${r.party_name}` : '') + '.'
    + (d.tank_no ? `\nTank No.: ${d.tank_no}` : '') + (d.truck_plate ? `\nTruck plate: ${d.truck_plate}` : '') + (d.valid_until ? `\nValid until: ${fmtDate(d.valid_until)}` : '')
    + `\n\nView, verify and download the certificate:\n${link}` + sign;
  if (type === 'leak') return hi + `Please find the Leak Test Certificate ${r.doc_no}` + (r.party_name ? ` for ${r.party_name}` : '') + '.'
    + `\nTest date: ${fmtDate(r.doc_date)}\nResult: ${d.result === 'FAIL' ? 'FAIL' : 'PASS'}` + (d.chassis_no ? `\nChassis No.: ${d.chassis_no}` : '')
    + `\n\nView, verify and download the certificate:\n${link}` + sign;
  if (type === 'dn') return hi + `Please find Delivery Note ${r.doc_no}` + (r.party_name ? ` for ${r.party_name}` : '') + '.'
    + (d.po_no ? `\nPO No.: ${d.po_no}` : '') + (d.truck_no ? `\nTruck No.: ${d.truck_no}` : '') + `\n\nDelivery note (PDF):\n${link}` + sign;
  return hi + `Please find Job Card ${r.doc_no}` + (r.party_name ? ` for ${r.party_name}` : '') + '.'
    + (d.equipment ? `\nEquipment: ${d.equipment}` : '') + (d.job_status ? `\nStatus: ${d.job_status}` : '') + `\n\nJob card (PDF):\n${link}` + sign;
}
async function sendWhatsApp(type, rec, makePdf) {
  const link = await waLink(type, rec, makePdf), text = waText(type, rec, link);

/* Invoice payments */
const PAY_LABEL = {paid: 'Paid', partial: 'Partially paid', unpaid: 'Unpaid', overdue: 'Overdue'};
function payState(total, paid, due) {
  const bal = r2((Number(total) || 0) - (Number(paid) || 0));
  if (bal <= 0.005) return 'paid';
  if (due && due < today()) return 'overdue';
  return paid > 0.005 ? 'partial' : 'unpaid';
}
async function paymentsFor(ids) {
  if (!ids.length) return {};
  const {data, error} = await sb.from('docs_payments').select('document_id, amount').in('document_id', ids);
  if (error) return null;           // table not there yet (SQL not run)
  const m = {}; data.forEach(p => m[p.document_id] = r2((m[p.document_id] || 0) + Number(p.amount))); return m;
}

      if (old?.path) removed.add(old.path);
      const s = {...img, changed: true};
      if (isQr) qr = s; else slots[i] = s;
      dirty = true; drawSlots();
    } catch (err) { toast('Could not open this image: ' + nice(err), true); }
  });
  form.addEventListener('click', e => {
    const x = e.target.closest('[data-x]'); if (!x) return;
    const i = x.dataset.x, old = i === 'qr' ? qr : slots[i];
    if (old?.path) removed.add(old.path);
    if (i === 'qr') qr = null; else slots[i] = null;
    dirty = true; drawSlots();
  });
  form.addEventListener('input', e => { dirty = true; if (e.target.id === 'statement') statementAuto = false; });
  form.addEventListener('change', e => {
    if (e.target.name === 'result' || e.target.name === 'test_method') {
      if (statementAuto) $('#statement').value = LEAK.statement(form.result.value);
      if (e.target.name === 'test_method' && Object.values(LEAK.medium).includes($('#test_medium').value.trim())) $('#test_medium').value = LEAK.medium[form.test_method.value];
    }

  const collect = () => ({

    party_name: $('#party_name').value.trim(),
    data: {
      ...d,

      chassis_no: $('#chassis_no').value.trim(), tank_serial: $('#tank_serial').value.trim(), test_method: form.test_method.value,

      result: form.result.value, statement: $('#statement').value.trim(), remarks: $('#remarks').value.trim()
    }
  });
  const makePdf = async () => {
    const v = collect();
    return pdfFor({...v, doc_no: rec?.doc_no}, slots, qrToken);
  };
  const run = async (btn, fn) => { const t = btn.textContent; btn.disabled = true; btn.textContent = 'Please wait…'; $('#err').textContent = '';
    try { await fn(); } catch (e) { $('#err').textContent = nice(e); } btn.disabled = false; btn.textContent = t; };

  $('#dl').onclick = e => run(e.target, async () => (await makePdf()).save((rec?.doc_no || 'Leak-Test-DRAFT') + '.pdf'));
  $('#wa')?.addEventListener('click', e => waClick(e.currentTarget, 'leak', rec, null, true));
  wireShare($('#sh'), makePdf, () => (rec?.doc_no || 'Leak-Test-DRAFT') + '.pdf',
    () => `Leak Test Certificate ${rec?.doc_no || ''} - ${$('#party_name').value.trim()}${$('#chassis_no').value.trim() ? ' (Chassis ' + $('#chassis_no').value.trim() + ')' : ''}`);
  $('#pv').onclick = e => run(e.target, async () => {
    const w = window.open('', '_blank');
    const url = (await makePdf()).output('bloburl');
    if (w) w.location = url; else location.href = url;
  });
  $('#del')?.addEventListener('click', e => run(e.target, async () => {
    if (!confirm(`Permanently delete ${rec.doc_no}?`)) return;
    const {error} = await sb.from('docs_documents').delete().eq('id', rec.id);
    if (error) throw error;
    const paths = [...(rec.files?.photos || []), rec.files?.qr].filter(Boolean);
    if (paths.length) await sb.storage.from(BUCKET).remove(paths);
    if (rec.files?.qr_token) await sb.storage.from(CERT_BUCKET).remove([rec.files.qr_token + '.pdf']);
    dirty = false; LIST = null; toast(rec.doc_no + ' deleted'); location.hash = '#leak';
  }));

  form.addEventListener('submit', e => { e.preventDefault(); if (!ro) run($('#save'), save); });
  async function save() {
    const v = collect();
    if (!v.doc_date) throw new Error('Please enter the report date.');
    if (!v.party_name) { $('#party_name').focus(); throw new Error('Please enter the client name.'); }
    let row = rec;
    if (!row) {
      const {data, error} = await sb.from('docs_documents').insert({doc_type: 'leak', ...v}).select().single();
      if (error) throw error;
      row = rec = data;
    } else {
      const {data, error} = await sb.from('docs_documents').update(v).eq('id', row.id).select().single();
      if (error) throw error;
      row = rec = data;
    }
    // upload new images, then store their paths
    const stamp = Date.now();
    const up = async (s, name, type) => {
      if (!s) return null;
      if (!s.changed) return s.path;
      const path = `leak/${row.id}/${name}-${stamp}.${type === 'image/png' ? 'png' : 'jpg'}`;
      const {error} = await sb.storage.from(BUCKET).upload(path, s.blob, {contentType: type, upsert: true});
      if (error) throw new Error('Image upload failed: ' + nice(error) + '. Please click Save again.');
      s.path = path; s.changed = false;
      return path;
    };
    const photos = [];
    for (let i = 0; i < 4; i++) photos.push(await up(slots[i], 'photo' + (i + 1), 'image/jpeg'));
    const files = {photos, qr_token: qrToken};
    const {data, error} = await sb.from('docs_documents').update({files}).eq('id', row.id).select().single();
    if (error) throw error;
    rec = data;
    await uploadCert(qrToken, await pdfFor(rec, slots, qrToken));     // the PDF the QR code opens
    if (removed.size) { await sb.storage.from(BUCKET).remove([...removed]); removed.clear(); }
    dirty = false; LIST = null;
    toast(`${rec.doc_no} saved`);
    goAfterSave('leak', rec.id);
  }
}

const num = v => { const n = parseFloat(String(v ?? '').replace(/,/g, '')); return Number.isFinite(n) ? n : 0; };
const money = n => (Number(n) || 0).toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});
const qtyTxt = v => String(v ?? '').trim() === '' ? '' : num(v).toLocaleString('en-US', {maximumFractionDigits: 3});
const r2 = x => Math.round(x * 100) / 100;

function words(n) {
  const a = ['', 'One', 'Two', 'Three', 'Four', 'Five', 'Six', 'Seven', 'Eight', 'Nine', 'Ten', 'Eleven', 'Twelve', 'Thirteen',
             'Fourteen', 'Fifteen', 'Sixteen', 'Seventeen', 'Eighteen', 'Nineteen'];
  const t = ['', '', 'Twenty', 'Thirty', 'Forty', 'Fifty', 'Sixty', 'Seventy', 'Eighty', 'Ninety'];
  const chunk = x => {
    const out = [];
    if (x >= 100) { out.push(a[Math.floor(x / 100)] + ' Hundred'); x %= 100; }
    if (x >= 20) out.push(t[Math.floor(x / 10)] + (x % 10 ? '-' + a[x % 10] : ''));
    else if (x) out.push(a[x]);
    return out.join(' ');
  };
  if (!n) return 'Zero';
  const out = [];
  for (const [u, name] of [[1e9, 'Billion'], [1e6, 'Million'], [1e3, 'Thousand']]) if (n >= u) { out.push(chunk(Math.floor(n / u)) + ' ' + name); n %= u; }
  if (n) out.push(chunk(n));
  return out.join(' ');
}
const sarWords = total => { const h = Math.round(total * 100), r = Math.floor(h / 100), hal = h % 100;
  return `Saudi Riyals ${words(r)}${hal ? ` and ${words(hal)} Halalas` : ''} Only`; };

function quoteTotals(items) {
  let sub = 0, vat = 0;
  const rows = items.map(it => {
    const line = num(it.qty) * num(it.rate);
    const tp = String(it.tax_pct ?? '').trim() === '' ? 15 : num(it.tax_pct);
    const v = line * tp / 100; sub += line; vat += v;
    return {...it, tp, vat: v, amount: line + v};
  });
  return {rows, sub: r2(sub), vat: r2(vat), total: r2(sub + vat)};
}

/* ---------- PDF ---------- */
function itemsPdf(type, r, img) {
  const T = IDOCS[type], d = r.data || {};
  const {jsPDF} = window.jspdf;
  const pdf = new jsPDF({unit: 'mm', format: 'a4', compress: true});
  const W = 210, H = 297, M = 12, CW = W - 2 * M;
  const hdrH = CW * img.header.h / img.header.w, ftrH = CW * img.footer.h / img.footer.w;
  const TOP = 5 + hdrH, BOTTOM = H - 5 - ftrH - 7;
  let y;
  const frame = () => {
    pdf.addImage(img.header.dataUrl, 'JPEG', M, 5, CW, hdrH, 'hdr');
    pdf.addImage(img.footer.dataUrl, 'JPEG', M, H - 5 - ftrH, CW, ftrH, 'ftr');
    pdf.setFont('helvetica', 'normal'); pdf.setFontSize(7.5); pdf.setTextColor(...C.slate);
    pdf.text(`VAT NO: ${VAT_NO}`, W - M, TOP + 4, {align: 'right'});
    pdf.setDrawColor(...C.slate); pdf.setLineWidth(0.5);
    pdf.line(M, TOP + 7, W - M, TOP + 7); pdf.line(M, TOP + 17, W - M, TOP + 17);
    pdf.setFont('helvetica', 'bold'); pdf.setFontSize(13.5);
    pdf.text(T.pdfTitle, W / 2, TOP + 12.2, {align: 'center', baseline: 'middle'});
    y = TOP + 23;
  };
  const newPage = () => { pdf.addPage(); frame(); };
  const need = h => { if (y + h > BOTTOM) { newPage(); return true; } return false; };
  const section = (t, width = CW) => {
    need(14);
    pdf.setFont('helvetica', 'bold'); pdf.setFontSize(9.5); pdf.setTextColor(...C.slate);
    pdf.text(t.toUpperCase(), M, y + 3.5);
    pdf.setDrawColor(...C.orange); pdf.setLineWidth(0.5); pdf.line(M, y + 5.3, M + width, y + 5.3);
    y += 8;
  };
  const kv = (pairs, cols = 2, width = CW) => {
    const colW = width / cols, LW = cols === 1 ? 42 : 32;
    for (let i = 0; i < pairs.length; i += cols) {
      const row = pairs.slice(i, i + cols);
      pdf.setFont('helvetica', 'normal'); pdf.setFontSize(9);
      const lines = row.map(([, v]) => hasAr(v) ? arImg(String(v).trim(), 9, {maxW: colW - LW - 3}) : pdf.splitTextToSize(String(v ?? '').trim() || '-', colW - LW - 3));
      const h = Math.max(7, Math.max(...lines.map(l => l.dataUrl ? (l.h + 2) / 4.1 : l.length)) * 4.1 + 3);
      need(h);
      row.forEach(([l], j) => {
        const x = M + j * colW;
        pdf.setFont('helvetica', 'bold'); pdf.setFontSize(8.5); pdf.setTextColor(...C.ink);
        pdf.text(l, x, y + 4.6);
        pdf.setFont('helvetica', 'normal'); pdf.setFontSize(9);
        if (lines[j].dataUrl) pdf.addImage(lines[j].dataUrl, 'PNG', x + LW - 0.3, y + 1.2, lines[j].w, lines[j].h);
        else pdf.text(lines[j], x + LW, y + 4.6, {lineHeightFactor: 1.15});
      });
      pdf.setDrawColor(...C.line); pdf.setLineWidth(0.2); pdf.line(M, y + h, M + width, y + h);
      y += h;
    }
    y += 3;
  };
  const table = (cols, rows) => {
    const fixed = cols.reduce((s, c) => s + (c.w || 0), 0);
    cols.forEach(c => { if (!c.w) c.w = CW - fixed; });
    const head = () => {
      let x = M;
      cols.forEach(c => {
        pdf.setFillColor(...C.shade); pdf.setDrawColor(...C.line); pdf.setLineWidth(0.2);   // text colour resets fill, so set it per cell
        pdf.rect(x, y, c.w, 7.5, 'FD');
        pdf.setFont('helvetica', 'bold'); pdf.setFontSize(8.3); pdf.setTextColor(...C.slate);
        pdf.text(c.label, c.align === 'right' ? x + c.w - 2 : x + 2, y + 4.8, {align: c.align === 'right' ? 'right' : 'left'});
        x += c.w;
      });
      y += 7.5;
    };
    need(16); head();
    rows.forEach(row => {
      pdf.setFont('helvetica', 'normal'); pdf.setFontSize(8.8);
      const lines = row.map((v, i) => hasAr(v) ? arImg(String(v).trim(), 8.8, {maxW: cols[i].w - 4}) : pdf.splitTextToSize(String(v ?? ''), cols[i].w - 4));
      const h = Math.max(7, Math.max(...lines.map(l => l.dataUrl ? (l.h + 2) / 3.9 : l.length)) * 3.9 + 3.2);
      if (need(h)) head();
      let x = M;
      cols.forEach((c, i) => {
        pdf.setDrawColor(...C.line); pdf.setLineWidth(0.2); pdf.rect(x, y, c.w, h, 'S');
        pdf.setTextColor(...C.ink); pdf.setFont('helvetica', 'normal'); pdf.setFontSize(8.8);
        if (lines[i].dataUrl) pdf.addImage(lines[i].dataUrl, 'PNG', c.align === 'right' ? x + c.w - 1.5 - lines[i].w : x + 1.5, y + 1.3, lines[i].w, lines[i].h);
        else pdf.text(lines[i], c.align === 'right' ? x + c.w - 2 : x + 2, y + 4.6, {align: c.align === 'right' ? 'right' : 'left', lineHeightFactor: 1.15});
        x += c.w;
      });
      y += h;
    });
    y += 4;
  };

  frame();
  const top = [[T.noLabel, r.doc_no || '(on save)'], [T.dateLabel, fmtDate(r.doc_date)],
               ...T.head.map(([k, l, t]) => [l, t === 'date' ? fmtDate(d[k]) : d[k]])];
  kv(top);
  section(T.partyTitle);
  kv([[T.partyLabel, r.party_name], ...T.party.map(([k, l]) => [l, d[k]])], 1);
  (T.body || []).forEach(([k, l]) => {
    if (!String(d[k] || '').trim()) return;
    section(l);
    pdf.setFont('helvetica', 'normal'); pdf.setFontSize(9.5); pdf.setTextColor(...C.ink);

const SELLER_AR = 'شركة الهياكل للصناعات المعدنية';
function zatcaQr(r) {
  const d = r.data || {}, enc = new TextEncoder();
  const fields = [SELLER_AR, VAT_NO, `${r.doc_date || today()}T12:00:00Z`, Number(d.grand_total || 0).toFixed(2), Number(d.vat_total || 0).toFixed(2)];
  const bytes = [];
  fields.forEach((v, i) => { const b = enc.encode(v); bytes.push(i + 1, b.length, ...b); });
  return btoa(String.fromCharCode(...bytes));
}
const iPdf = async (type, r, photos) => {

  if (type !== 'tank') return itemsPdf(type, r, await assets());

  return tankPdf(r, {...await assets(), photos: await withEl(photos)});
};

    if (rec) res = await sb.from('docs_documents').update(v).eq('id', rec.id).select().single();
    else {
      const manual = $('#f_no').value.trim();
      res = await sb.from('docs_documents').insert({doc_type: type, ...v, ...(manual ? {doc_no: manual} : {})}).select().single();
    }
    if (res.error) throw new Error(res.error.code === '23505' ? 'This number already exists. Leave it blank or enter a different one.' : nice(res.error));
    rec = res.data; dirty = false;
    toast(`${rec.doc_no} saved`);
    goAfterSave(type, rec.id);
  }); });
}

const BLUE = [31, 90, 166], RED = [192, 0, 0], SILVER = [217, 217, 217], LIGHT = [244, 247, 247];
const fullDate = v => { if (!v) return '-'; const d = new Date(v + 'T00:00:00'); if (isNaN(d)) return v;
  return `${d.toLocaleDateString('en-GB', {weekday: 'long'})}, ${d.getDate()} ${d.toLocaleDateString('en-GB', {month: 'long'})} ${d.getFullYear()}`; };
const addMonths = (v, m) => { const d = new Date(v + 'T00:00:00'); d.setMonth(d.getMonth() + m);
  return new Intl.DateTimeFormat('en-CA').format(d); };
const TANK = {
  noteEn: valid => `We inform you that the Tank Trailer has completed the periodic maintenance work for all the axles of the Tank Trailer in the workshop, valid for 6 months until ${fullDate(valid)}, subject to no accidents or damages occurring.`,
  noteAr: valid => `نحيط سعادتكم علماً بأنه تم الانتهاء من الصيانة الدورية لمقطورة الصهريج لجميع المحاور في الورشة، وهي صالحة لمدة ستة أشهر حتى تاريخ ${arDate(valid)}م، ما لم يتعرض لحادث أو ضرر.`,
  oldAr: 'نحيط سعادتكم علما بأنه قد تم صيانة تانكي\nمحروقات محاورقاعدة وبذالك تكون صالحة لمدة\nستة شهور'
};
const AR_MONTHS = ['يناير', 'فبراير', 'مارس', 'أبريل', 'مايو', 'يونيو', 'يوليو', 'أغسطس', 'سبتمبر', 'أكتوبر', 'نوفمبر', 'ديسمبر'];
function arDate(d) { if (!d) return '…'; const [y, m, day] = d.split('-').map(Number); return `${day} ${AR_MONTHS[m - 1]} ${y}`; }
IDOCS.tank = {
  title: 'Tank Certificate', plural: 'Tank Certificates', group: 'customer', custom: true,
  nextNo: (list, date) => { const y = (date || today()).slice(0, 4); return `HMI-${y}-${String(maxNo(list, new RegExp(`^HMI-${y}-(\\d+)$`)) + 1).padStart(3, '0')}`; },
  party: [['customer_address', 'Address']],
  listCols: [['Customer', r => who(r.party_name)], ['Tank No.', r => esc(r.data?.tank_no)], ['Truck Plate', r => esc(r.data?.truck_plate)], ['Valid Until', r => esc(fmtDate(r.data?.valid_until))]],
  search: r => [r.data?.tank_no, r.data?.truck_plate, r.data?.serial_no]
};

/* Arabic is drawn by the browser (correct joining + right-to-left) onto a canvas, then placed in the PDF as an image */
const AR_FONT = '"Noto Naskh Arabic", "Segoe UI", Tahoma, Arial, sans-serif';
async function arabicReady() { try { await Promise.all([document.fonts.load(`400 20px ${AR_FONT}`, 'شركة'), document.fonts.load(`700 20px ${AR_FONT}`, 'شركة')]); } catch (e) {} }
const hasAr = v => /[\u0600-\u06FF]/.test(String(v ?? ''));
function arImg(text, pt, {color = '#000', bold = false, maxW = null} = {}) {
  const rtl = !/^[^\u0600-\u06FFA-Za-z]*[A-Za-z]/.test(String(text || ''));   // first letter decides direction
  const S = 12, px = pt * 0.3528 * S;                       // 12 px per mm
  const c = document.createElement('canvas'), g = c.getContext('2d');
  const font = `${bold ? 700 : 400} ${px}px ${AR_FONT}`;
  g.font = font;
  const lines = [];
  String(text || '').split('\n').forEach(par => {
    if (!maxW) { lines.push(par); return; }
    let cur = '';
    par.split(/\s+/).forEach(w => { const t = cur ? cur + ' ' + w : w; if (cur && g.measureText(t).width > maxW * S) { lines.push(cur); cur = w; } else cur = t; });
    lines.push(cur);
  });
  const lh = px * 1.55;
  c.width = Math.ceil(Math.max(1, ...lines.map(l => g.measureText(l).width))) + 6;
  c.height = Math.ceil(lines.length * lh) + 4;
  g.font = font; g.fillStyle = color; g.direction = rtl ? 'rtl' : 'ltr'; g.textAlign = rtl ? 'right' : 'left'; g.textBaseline = 'middle';
  lines.forEach((l, i) => g.fillText(l, rtl ? c.width - 3 : 3, 2 + lh * (i + 0.5)));
  return {dataUrl: c.toDataURL('image/png'), w: c.width / S, h: c.height / S};
}
function drawQr(pdf, text, x, y, size) {
  const q = qrcode(0, 'M'); q.addData(unescape(encodeURIComponent(text))); q.make();
  const n = q.getModuleCount(), m = size / (n + 2);
  pdf.setFillColor(255, 255, 255); pdf.rect(x, y, size, size, 'F'); pdf.setFillColor(0, 0, 0);
  for (let r = 0; r < n; r++) for (let col = 0; col < n; col++) if (q.isDark(r, col)) pdf.rect(x + (col + 1) * m, y + (r + 1) * m, m + 0.02, m + 0.02, 'F');
}

function tankPdf(r, img) {
  const d = r.data || {};
  const {jsPDF} = window.jspdf;
  const pdf = new jsPDF({unit: 'mm', format: 'a4', compress: true});
  const W = 210, H = 297, M = 12, CW = W - 2 * M;
  const hdrH = CW * img.header.h / img.header.w, ftrH = CW * img.footer.h / img.footer.w;
  const TOP = 5 + hdrH;
  pdf.addImage(img.header.dataUrl, 'JPEG', M, 5, CW, hdrH, 'hdr');
  pdf.addImage(img.footer.dataUrl, 'JPEG', M, H - 5 - ftrH, CW, ftrH, 'ftr');
  pdf.setFont('helvetica', 'normal'); pdf.setFontSize(7.5); pdf.setTextColor(...C.slate);
  pdf.text(`VAT NO: ${VAT_NO}`, W - M, TOP + 4, {align: 'right'});
  const ar = (t, x, y, pt, o = {}) => {             // x = right edge (or centre when o.center)
    const a = arImg(t, pt, o);
    const left = o.center ? x - a.w / 2 : x - a.w;
    pdf.addImage(a.dataUrl, 'PNG', left, y - a.h / 2, a.w, a.h);
    return a;
  };
  let y = TOP + 16;
  pdf.setFont('helvetica', 'bold'); pdf.setFontSize(13); pdf.setTextColor(...BLUE);
  pdf.text('Aramco Certificate for Tank Trailer Axles', W / 2, y, {align: 'center'});
  ar('شهادة أرامكو لمحاورالخزان', W / 2, y + 7, 13, {color: '#1F5AA6', center: true});
  y += 15;

  // three rows of paired fields: English label : Arabic label | red value
  const LW = 52, VW = CW / 2 - LW, RH = 12;
  const lab = (en, arTxt, x, yy) => {
    pdf.setFont('helvetica', 'bold'); pdf.setFontSize(8.2); pdf.setTextColor(...C.ink);
    pdf.text(en + ' :', x + 1.5, yy, {baseline: 'middle'});
    ar(arTxt, x + LW - 1.5, yy, 8.5);
  };
  const val = (v, x, yy, w, color = RED, size = 9.5) => {
    if (hasAr(v)) { const a = arImg(String(v).trim(), size, {bold: true, color: `rgb(${color.join(',')})`, maxW: w - 3});
      pdf.addImage(a.dataUrl, 'PNG', x + (w - a.w) / 2, yy - a.h / 2, a.w, a.h); return; }
    pdf.setFont('helvetica', 'bold'); pdf.setFontSize(size); pdf.setTextColor(...color);
    const lines = pdf.splitTextToSize(String(v ?? '').trim() || '-', w - 3);
    pdf.text(lines, x + w / 2, yy - (lines.length - 1) * 2, {align: 'center', baseline: 'middle'});
  };
  [[['Date', 'التاريخ', fullDate(r.doc_date)], ['Certificate No', 'رقم الشهادة', r.doc_no || '(on save)']],
   [['Serial No', 'الرقم التسلسلي', d.serial_no], ['Tank No', 'رقم الخزان', d.tank_no]],
   [['Truck Plate Number', 'رقم لوحة السيارة', d.truck_plate], ['Tank Capacity', 'سعة التانكي', d.tank_capacity]]].forEach(row => {
    row.forEach(([en, a, v], i) => { const x = M + i * (CW / 2); lab(en, a, x, y + RH / 2); val(v, x + LW, y + RH / 2, VW); });
    pdf.setDrawColor(...C.line); pdf.setLineWidth(0.25); pdf.line(M, y + RH, W - M, y + RH);
    y += RH;
  });
  y += 5;

  // customer block
  pdf.setFillColor(...LIGHT); pdf.rect(M, y, CW, 22, 'F');
  [['Customer\'s Name', 'اسم العميل', r.party_name], ['Customer\'s Address', 'عنوان العميل', d.customer_address]].forEach(([en, a, v], i) => {
    const yy = y + 5.5 + i * 11;
    lab(en, a, M + 1, yy);
    val(v, M + LW + 2, yy, CW - LW - 2, C.ink, 9.5);
  });
  y += 28;

  // addressed to
  pdf.setFillColor(...SILVER); pdf.rect(M, y, CW, 11, 'F');
  pdf.setFont('helvetica', 'bold'); pdf.setFontSize(10.5); pdf.setTextColor(...C.ink);
  pdf.text('SAUDI ARAMCO', M + 4, y + 5.5, {baseline: 'middle'});
  ar('أرامكو السعودية', W - M - 4, y + 5.5, 11, {color: '#1F5AA6'});
  y += 11;
  pdf.setFillColor(...LIGHT); pdf.rect(M, y, CW, 10, 'F');
  pdf.setFont('helvetica', 'bold'); pdf.setFontSize(9.5); pdf.setTextColor(...C.ink);
  pdf.text('Respected', M + 4, y + 5, {baseline: 'middle'});
  ar('المحترمين', W - M - 4, y + 5, 10);
  y += 10;

  // certification text, English left | Arabic right
  pdf.setFont('helvetica', 'bold'); pdf.setFontSize(9.5);
  const enLines = pdf.splitTextToSize(d.note_en || TANK.noteEn(d.valid_until), CW / 2 - 8);
  const arBlock = arImg(d.note_ar || TANK.noteAr(d.valid_until), 10.5, {maxW: CW / 2 - 8});
  const bh = Math.max(enLines.length * 4.9, arBlock.h) + 10;
  pdf.setFillColor(...LIGHT); pdf.rect(M, y, CW, bh, 'F');
  pdf.setTextColor(...C.ink); pdf.text(enLines, M + 4, y + 7, {lineHeightFactor: 1.45});
  pdf.addImage(arBlock.dataUrl, 'PNG', W - M - 4 - arBlock.w, y + 4, arBlock.w, arBlock.h);
  y += bh + 10;

  // QR (left) and company stamp (right)
  const qrText = r.files?.qr_token ? verifyUrl(r.files.qr_token)
    : `Al Hyakel Metal Industries | Certificate ${r.doc_no || 'DRAFT'} | Tank ${d.tank_no || '-'} | Truck ${d.truck_plate || '-'} | Valid until ${d.valid_until || '-'}`;
  const QR = 40;
  drawQr(pdf, qrText, M + 2, y, QR);
  pdf.setFont('helvetica', 'normal'); pdf.setFontSize(6.5); pdf.setTextColor(...C.muted);
  pdf.text('Scan to verify this certificate', M + 2 + QR / 2, y + QR + 3, {align: 'center'});
  const sk = Math.min(50 / img.stamp.w, 25 / img.stamp.h), sw = img.stamp.w * sk, sh = img.stamp.h * sk;
  pdf.addImage(img.stamp.dataUrl, 'PNG', W - M - 6 - sw, y + QR - sh, sw, sh, 'stamp');
  const hasPhotos = (img.photos || []).some(Boolean), pages = hasPhotos ? 2 : 1;
  const foot = n => { pdf.setFont('helvetica', 'normal'); pdf.setFontSize(7.5); pdf.setTextColor(...C.muted);
    pdf.text(`${r.doc_no || 'DRAFT'}   |   Page ${n} of ${pages}`, W - M, H - 5 - ftrH - 2.5, {align: 'right'}); };
  foot(1);
  if (hasPhotos) {            // page 2: photos of the tank / trailer, same layout as the Leak Test
    pdf.addPage();
    pdf.addImage(img.header.dataUrl, 'JPEG', M, 5, CW, hdrH, 'hdr');
    pdf.addImage(img.footer.dataUrl, 'JPEG', M, H - 5 - ftrH, CW, ftrH, 'ftr');
    pdf.setFont('helvetica', 'bold'); pdf.setFontSize(9); pdf.setTextColor(...C.slate);
    pdf.text([r.doc_no, d.tank_no && `Tank ${d.tank_no}`, d.truck_plate && `Truck ${d.truck_plate}`].filter(Boolean).join('   |   '), W / 2, TOP + 7, {align: 'center'});
    drawPhotoGrid(pdf, img.photos, M, TOP + 12, CW, 156);               // same card shape as the Leak Test photos page
    pdf.addImage(img.stamp.dataUrl, 'PNG', W / 2 - sw / 2, TOP + 12 + 156 + (H - 5 - ftrH - 6 - (TOP + 168) - sh) / 2, sw, sh, 'stamp');
    foot(2);
  }
  return pdf;
}

  wireShare($('#sh'), () => iPdf(type, draft(), slots), () => (draft().doc_no || 'Tank-Certificate-DRAFT') + '.pdf',
    () => { const v = draft(); return `Tank Inspection Certificate ${v.doc_no || ''} - ${v.party_name} - Tank ${v.data.tank_no || '-'}, valid until ${fmtDate(v.data.valid_until)}`; });
  $('#pv').onclick = e => run(e.target, async () => { const w = window.open('', '_blank'); const url = (await iPdf(type, draft(), slots)).output('bloburl'); if (w) w.location = url; else location.href = url; });
  $('#del')?.addEventListener('click', e => run(e.target, async () => {
    if (!confirm(`Permanently delete ${rec.doc_no}?`)) return;
    const {error} = await sb.from('docs_documents').delete().eq('id', rec.id); if (error) throw error;
    const ph = (rec.files?.photos || []).filter(Boolean); if (ph.length) await sb.storage.from(BUCKET).remove(ph);
    if (rec.files?.qr_token) await sb.storage.from(CERT_BUCKET).remove([rec.files.qr_token + '.pdf']);
    dirty = false; toast(rec.doc_no + ' deleted'); location.hash = '#tank';
  }));
  form.addEventListener('submit', e => { e.preventDefault(); if (!ro) run($('#save'), async () => {
    const v = collect();
    if (!v.doc_date) throw new Error('Please enter the date.');
    if (!v.party_name) { $('#f_party').focus(); throw new Error('Please enter the customer name.'); }
    let res;
    v.files = {...(rec?.files || {}), qr_token: qrToken};
    if (rec) res = await sb.from('docs_documents').update(v).eq('id', rec.id).select().single();
    else { const manual = $('#f_no').value.trim(); res = await sb.from('docs_documents').insert({doc_type: type, ...v, ...(manual ? {doc_no: manual} : {})}).select().single(); }
    if (res.error) throw new Error(res.error.code === '23505' ? 'This number already exists. Leave it blank or enter a different one.' : nice(res.error));
    rec = res.data;
    // upload new photos, then store their paths
    const stamp = Date.now(), photos = [];
    for (let i = 0; i < 4; i++) {
      const sl = slots[i];
      if (!sl) { photos.push(null); continue; }
      if (sl.changed) {
        const path = `tank/${rec.id}/photo${i + 1}-${stamp}.jpg`;
        const {error} = await sb.storage.from(BUCKET).upload(path, sl.blob, {contentType: 'image/jpeg', upsert: true});
        if (error) throw new Error('Image upload failed: ' + nice(error) + '. Please click Save again.');
        sl.path = path; sl.changed = false;
      }
      photos.push(sl.path);
    }
    const up = await sb.from('docs_documents').update({files: {...(rec.files || {}), qr_token: qrToken, photos}}).eq('id', rec.id).select().single();
    if (up.error) throw up.error;
    rec = up.data; dirty = false;
    await uploadCert(qrToken, await iPdf(type, rec, slots));
    if (removed.size) { await sb.storage.from(BUCKET).remove([...removed]); removed.clear(); }
    toast(`${rec.doc_no} saved`);
    goAfterSave('tank', rec.id);
  }); });
}


/* ===================== CASH RECEIPT (سند قبض) ===================== */
// Money received from a customer. Can be linked to an invoice: the payment is then recorded on that invoice too.
const RCPT_METHODS = ['Cash', 'Cheque', 'Bank transfer', 'Card'];
IDOCS.receipt = {
  title: 'Cash Receipt', plural: 'Cash Receipts', group: 'customer', custom: true,
  nextNo: (list, date) => { const y = (date || today()).slice(0, 4); return `CR-${y}-${String(maxNo(list, new RegExp(`^CR-${y}-(\\d+)$`)) + 1).padStart(3, '0')}`; },
  party: [],
  listCols: [['Received from', r => who(r.party_name)], ['Method', r => esc(r.data?.method)], ['Invoice', r => esc(r.data?.invoice_no)], ['Amount (SAR)', r => money(r.data?.amount), 'money']],
  search: r => [r.data?.invoice_no, r.data?.purpose, r.data?.reference, r.data?.method]
};

function receiptPdf(r, img) {
  const d = r.data || {};
  const {jsPDF} = window.jspdf;
  const pdf = new jsPDF({unit: 'mm', format: 'a4', compress: true});
  const W = 210, M = 12, CW = W - 2 * M, hh = CW * img.header.h / img.header.w;
  const ar = (t, x, y, pt, o = {}) => { const a = arImg(t, pt, o); pdf.addImage(a.dataUrl, 'PNG', o.left ? x : x - a.w, y - a.h / 2, a.w, a.h); return a; };
  const amount = Number(d.amount) || 0;
  const half = (y0, label) => {
    pdf.addImage(img.header.dataUrl, 'JPEG', M, y0, CW, hh, 'hdr');
    let y = y0 + hh + 7;
    // title + copy label
    pdf.setFont('helvetica', 'bold'); pdf.setFontSize(16); pdf.setTextColor(...C.slate);
    pdf.text('CASH RECEIPT', M, y + 2);
    ar('سند قبض', M + pdf.getTextWidth('CASH RECEIPT') + 5, y + 0.6, 14, {left: true, color: '#2E5868', bold: true});
    pdf.setFont('helvetica', 'normal'); pdf.setFontSize(8); pdf.setTextColor(...C.muted);
    pdf.text(label + `   |   VAT No: ${VAT_NO}`, M, y + 7.5);
    // amount box
    const bw = 62, bx = W - M - bw;
    pdf.setDrawColor(...C.slate); pdf.setLineWidth(0.6); pdf.roundedRect(bx, y - 6, bw, 15, 1.5, 1.5, 'S');
    pdf.setFillColor(...C.slate); pdf.roundedRect(bx, y - 6, 16, 15, 1.5, 1.5, 'F'); pdf.rect(bx + 8, y - 6, 8, 15, 'F');
    pdf.setFont('helvetica', 'bold'); pdf.setFontSize(10); pdf.setTextColor(255, 255, 255); pdf.text('SAR', bx + 8, y + 2.8, {align: 'center'});
    pdf.setFontSize(15); pdf.setTextColor(...C.ink); pdf.text(money(amount), bx + bw - 3, y + 3.4, {align: 'right'});
    y += 14;
    // no. and date
    pdf.setDrawColor(...C.line); pdf.setLineWidth(0.25); pdf.line(M, y, W - M, y);
    pdf.setFont('helvetica', 'bold'); pdf.setFontSize(9); pdf.setTextColor(...C.ink);
    pdf.text('Receipt No.', M, y + 6); pdf.setTextColor(...RED); pdf.setFontSize(10.5); pdf.text(r.doc_no || 'DRAFT', M + 23, y + 6);
    ar('رقم السند', M + 80, y + 5.2, 8.5);
    pdf.setFont('helvetica', 'bold'); pdf.setFontSize(9); pdf.setTextColor(...C.ink); pdf.text('Date', W / 2 + 6, y + 6);
    pdf.setFont('helvetica', 'normal'); pdf.text(fullDate(r.doc_date), W / 2 + 18, y + 6);
    ar('التاريخ', W - M, y + 5.2, 8.5);
    y += 10;
    // lines: English label | value | Arabic label
    const line = (en, arTxt, value, h = 10) => {
      pdf.setFont('helvetica', 'bold'); pdf.setFontSize(9); pdf.setTextColor(...C.slate); pdf.text(en, M, y + 6);
      const aw = ar(arTxt, W - M, y + 5.2, 9).w;
      const x0 = M + 40, x1 = W - M - aw - 4;
      pdf.setDrawColor(...C.line); pdf.setLineDashPattern([0.6, 0.9], 0); pdf.line(x0, y + 7.6, x1, y + 7.6); pdf.setLineDashPattern([], 0);
      const v = String(value || '').trim() || '-';
      if (hasAr(v)) { const a = arImg(v, 10, {maxW: x1 - x0 - 2, bold: true}); const k = Math.min(1, 8 / a.h); pdf.addImage(a.dataUrl, 'PNG', x0 + 1, y + 6 - a.h * k + 1.6, a.w * k, a.h * k); }
      else { pdf.setFont('helvetica', 'bold'); pdf.setFontSize(10); pdf.setTextColor(...C.ink); pdf.text(pdf.splitTextToSize(v, x1 - x0 - 2)[0], x0 + 1, y + 6); }
      y += h;
    };
    line('Received from', 'استلمنا من السيد / السادة', r.party_name);
    line('The sum of', 'مبلغ وقدره', sarWords(amount));
    line('Being', 'وذلك عن', [d.purpose, d.invoice_no && `against invoice ${d.invoice_no}`].filter(Boolean).join(', '));
    line('Paid by', 'طريقة الدفع', [d.method, d.reference && `No. ${d.reference}`, d.bank].filter(Boolean).join(', '));
    // signatures + stamp
    y += 18;
    const sw = 46, sh = img.stamp.h * sw / img.stamp.w;
    pdf.addImage(img.stamp.dataUrl, 'PNG', W / 2 - sw / 2, y + 9 - sh, sw, sh, 'stamp');
    pdf.setDrawColor(...C.ink); pdf.setLineWidth(0.35); pdf.line(M, y + 6, M + 60, y + 6); pdf.line(W - M - 60, y + 6, W - M, y + 6);
    pdf.setFont('helvetica', 'bold'); pdf.setFontSize(8.5); pdf.setTextColor(...C.slate);
    pdf.text('Received by (Al Hyakel)', M, y + 10.5); ar('المستلم', M + 60, y + 10, 8.5);
    pdf.text('Paid by (Customer)', W - M - 60, y + 10.5); ar('الدافع', W - M, y + 10, 8.5);
  };
  half(6, 'Original');
  pdf.setDrawColor(...C.muted); pdf.setLineWidth(0.2); pdf.setLineDashPattern([2, 1.5], 0); pdf.line(4, 148.5, W - 4, 148.5); pdf.setLineDashPattern([], 0);
  pdf.setFont('helvetica', 'normal'); pdf.setFontSize(6.5); pdf.setTextColor(...C.muted); pdf.text('cut here', W / 2, 147.3, {align: 'center'});
  half(154, 'Copy');
  return pdf;
}

async function showReceiptForm(id, copyFrom) {
  const seq = ROUTE_SEQ, type = 'receipt', T = IDOCS.receipt;
  view.innerHTML = '<div class="ah-skel" role="status" aria-label="Loading"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>';
  let list, invoices, others;
  try { [list, invoices, ...others] = await Promise.all([loadIList(type, true), loadIList('invoice', true), ...GROUP_TYPES('customer').filter(t => t !== type && t !== 'invoice').map(t => loadIList(t))]); others = others.flat(); }
  catch (e) { view.innerHTML = `<p class="flash">Database error: ${esc(nice(e))}</p>`; return; }
  let rec = null, src = null;
  if (id || copyFrom) {
    const {data} = await sb.from('docs_documents').select('*').eq('id', id || copyFrom).eq('doc_type', type).maybeSingle();
    if (!data) { view.innerHTML = `<p class="flash">Receipt not found. <a href="#receipt">Back to list</a></p>`; return; }
