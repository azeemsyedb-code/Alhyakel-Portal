<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Certificate check | Al Hyakel Metal Industries</title>
<link rel="icon" href="assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Noto+Naskh+Arabic:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--brand:#1D6E80;--orange:#E07A2E;--ink:#1F2D35;--muted:#73818A;--line:#E6EBEE;--bg:#F5F7F9;
  --ok:#2E9E6A;--ok-bg:#E9F7EF;--bad:#D9475B;--bad-bg:#FDEEF0;--na:#73818A;--na-bg:#EEF1F3}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 'IBM Plex Sans','Segoe UI',system-ui,sans-serif;min-height:100vh;
  display:flex;flex-direction:column;align-items:center;padding:24px 16px calc(24px + env(safe-area-inset-bottom))}
.ar{font-family:'Noto Naskh Arabic','Segoe UI',serif;direction:rtl}
.brand{display:flex;align-items:center;gap:12px;margin:6px 0 18px}
.brand img{height:46px;width:auto}
.brand b{display:block;font-size:16px;font-weight:600;line-height:1.2}
.brand span{display:block;color:var(--muted);font-size:13px}
.card{background:#fff;border-radius:16px;box-shadow:0 10px 30px rgba(30,60,80,.10);width:min(440px,100%);overflow:hidden}
.st{padding:26px 22px 22px;text-align:center}
.st .ic{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;margin:0 auto 12px;color:#fff}
.st .ic svg{width:34px;height:34px}
.st h1{margin:0;font-size:26px;font-weight:600;letter-spacing:.01em}
.st h1 .ar{display:block;font-size:20px;font-weight:700;margin-top:2px}
.st p{margin:8px 0 0;color:var(--ink);font-size:15px}
.ok{background:var(--ok-bg)} .ok .ic{background:var(--ok)} .ok h1{color:var(--ok)}
.bad{background:var(--bad-bg)} .bad .ic{background:var(--bad)} .bad h1{color:var(--bad)}
.na{background:var(--na-bg)} .na .ic{background:var(--na)} .na h1{color:var(--na)}
dl{margin:0;padding:6px 22px 4px}
dl div{display:flex;justify-content:space-between;gap:16px;padding:10px 0;border-bottom:1px solid var(--line)}
dl div:last-child{border-bottom:0}
dt{color:var(--muted);font-size:13.5px;flex:0 0 auto}
dd{margin:0;text-align:right;font-weight:500;word-break:break-word}
.act{padding:14px 22px 22px}
.btn{display:block;text-align:center;background:var(--brand);color:#fff;text-decoration:none;font-weight:600;padding:13px 16px;border-radius:10px}
.btn:focus-visible{outline:3px solid #9CC9D3;outline-offset:2px}
.foot{color:var(--muted);font-size:12.5px;text-align:center;margin-top:18px;max-width:440px}
.foot a{color:var(--brand)}
.load{padding:40px 22px;text-align:center;color:var(--muted)}
</style>
</head>
<body>
<div class="brand"><img src="assets/logo_mark.png" alt=""><div><b>Al Hyakel Metal Industries</b><span class="ar">شركة الهياكل المعدنية الصناعية</span></div></div>
<main class="card" id="card" aria-live="polite"><div class="load">Checking certificate…</div></main>
<p class="foot">This page is generated by the Al Hyakel portal from its live records.<br>Questions: <a href="tel:+966541857480">0541857480</a> · <a href="https://www.alhyakel.com">www.alhyakel.com</a></p>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/config.js"></script>
<script>
(async () => {
  const card = document.getElementById('card'), CFG = window.PORTAL_CONFIG || {};
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
  const ICON = {ok: '<path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>',
    bad: '<path d="M7 7l10 10M17 7L7 17" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/>',
    na: '<path d="M12 7v6M12 16.5v.5" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/>'};
  const show = (cls, en, ar, line, rows = [], pdf = '') => {
    card.innerHTML = `<div class="st ${cls}"><div class="ic"><svg viewBox="0 0 24 24" aria-hidden="true">${ICON[cls]}</svg></div>
      <h1>${en}<span class="ar">${ar}</span></h1>${line ? `<p>${line}</p>` : ''}</div>
      ${rows.length ? `<dl>${rows.filter(r => r[1]).map(([k, v]) => `<div><dt>${k}</dt><dd>${esc(v)}</dd></div>`).join('')}</dl>` : ''}
      ${pdf ? `<div class="act"><a class="btn" href="${pdf}" target="_blank" rel="noopener">Open the certificate (PDF)</a></div>` : ''}`;
  };
  const token = (new URLSearchParams(location.search).get('c') || '').toLowerCase();
  if (!/^[0-9a-f]{32}$/.test(token) || !CFG.SUPABASE_URL) { show('na', 'Not recognised', 'غير معروف', 'This QR code does not belong to a certificate issued by Al Hyakel.'); return; }
  const sb = supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_ANON_KEY, {auth: {persistSession: false}});
  const {data: c, error} = await sb.rpc('cert_verify', {p_token: token});
  if (error) { show('na', 'Could not check', 'تعذر التحقق', 'Please check the internet connection and scan again.'); return; }
  if (!c) { show('bad', 'Not found', 'غير موجودة', 'No certificate with this code exists in our records. It may have been withdrawn.'); return; }
  const fmt = d => d ? new Intl.DateTimeFormat('en-GB', {day: 'numeric', month: 'long', year: 'numeric', timeZone: 'UTC'}).format(new Date(d + 'T00:00:00Z')) : '';
  const today = new Intl.DateTimeFormat('en-CA', {timeZone: 'Asia/Riyadh'}).format(new Date());
  const pdf = `${String(CFG.SUPABASE_URL).replace(/\/+$/, '')}/storage/v1/object/public/certs/${token}.pdf`;
  if (c.type === 'tank') {
    const valid = c.valid_until && c.valid_until >= today;
    const rows = [['Certificate No.', c.doc_no], ['Customer', c.party_name], ['Issued', fmt(c.doc_date)], ['Valid until', fmt(c.valid_until)],
      ['Tank No.', c.tank_no], ['Truck plate', c.truck_plate], ['Serial No.', c.serial_no], ['Capacity', c.capacity]];
    if (!c.valid_until) show('ok', 'Genuine certificate', 'شهادة أصلية', 'Tank Trailer Axles Certificate', rows, pdf);
    else if (valid) show('ok', 'Valid', 'صالحة', `Tank Trailer Axles Certificate, valid until <b>${fmt(c.valid_until)}</b>`, rows, pdf);
    else show('bad', 'Expired', 'منتهية الصلاحية', `This certificate expired on <b>${fmt(c.valid_until)}</b>. A new inspection is required.`, rows, pdf);
  } else {
    const pass = c.result !== 'FAIL';
    const rows = [['Test No.', c.doc_no], ['Customer', c.party_name], ['Test date', fmt(c.doc_date)], ['Result', pass ? 'PASS' : 'FAIL'],
      ['Trailer chassis No.', c.chassis_no], ['Tank serial No.', c.tank_serial], ['Capacity', c.capacity]];
    if (pass) show('ok', 'Genuine certificate', 'شهادة أصلية', `Leak Test Inspection: <b>PASS</b>, tested on ${fmt(c.doc_date)}`, rows, pdf);
    else show('bad', 'Test failed', 'لم يجتز الاختبار', `Leak Test Inspection on ${fmt(c.doc_date)}: <b>FAIL</b>. Not certified for service.`, rows, pdf);
  }
})();
</script>
</body>
</html>
